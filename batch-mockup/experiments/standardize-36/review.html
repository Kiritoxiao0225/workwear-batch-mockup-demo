<script>
'use strict';
const DATA=/*__RUN_DATA__*/null;
let reviews={},supplements={},aStates={},cards=[],dirty=new Set();
const $=id=>document.getElementById(id);
const text=(tag,value,className)=>{const e=document.createElement(tag);e.textContent=value;if(className)e.className=className;return e};
const defaultText=c=>c.result.parsed?.standardizedRequirement||c.result.rawContent||'';
const stateNames={pending:'尚未运行',running:'正在识别',returned:'已返回 · 待核对',failed:'请求失败',invalid_output:'返回格式问题',scope_pending:'本轮未调用'};
function download(name,value){const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function openImage(c,img){$('imageTitle').textContent=c.caseId+' · '+(img.label||'图'+img.index)+' · '+img.width+'×'+img.height;$('largeImage').src=img.asset;$('largeImage').alt=c.caseId+' 图'+img.index+'原图';$('originalLink').href=img.asset;$('imageCanvas').classList.remove('full');$('imageScale').textContent='原始尺寸';$('imageDialog').showModal()}

const isConfirmed=c=>{const x=aStates[c.caseId]?.confirmations?.at(-1);return !!x&&x.text===reviews[c.caseId]?.text&&x.supplementRevision===(supplements[c.caseId]?.revision||0)&&!dirty.has(c.caseId)};
const effectiveState=c=>pendingMaterials(c)?'pending':isConfirmed(c)?'checked':reviews[c.caseId]?.state||'pending';
function supplementPanel(c){
 const box=text('details','','supplement-box'),heading=text('summary',c.scope?.missingMaterial?'缺少素材 · 可在这里补传':'补充素材'),hint=text('p',c.scope?.missingMaterial?.reason||'客服漏传的Logo或参考图，可以在这里补充。','subtle'),list=text('div',''),state=text('p','','supplement-status subtle');box.open=!!c.scope?.missingMaterial||hasSupplement(c);box.append(heading,hint,list,state);
 const target=document.createElement('input');target.type='text';target.placeholder='用于哪里，例如：左胸Logo、后背字体参考';target.setAttribute('aria-label',c.caseId+' 补图用途');target.value=c.scope?.missingMaterial?.target||'';
 const file=document.createElement('input');file.type='file';file.accept='image/png,image/jpeg,image/webp';file.setAttribute('aria-label',c.caseId+' 选择补充素材');
 const button=text('button','上传补充素材','primary'),feedback=text('p','','feedback');button.setAttribute('aria-label',c.caseId+' 上传补充素材');feedback.setAttribute('role','status');box.append(target,file,text('p','支持PNG、JPG、WebP，单张不超过15MB；补图保存于本地，不覆盖原附件。','subtle'),button,feedback);
 let pendingUpload=null;file.onchange=()=>{pendingUpload=null};target.oninput=()=>{pendingUpload=null};
 async function post(payload){const response=await fetch('/api/supplements',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const result=await response.json();if(!response.ok)throw new Error(result.error||'保存失败');supplements[c.caseId]=result;await refreshA();render();applyFilter()}
 function render(){list.replaceChildren();const items=(supplements[c.caseId]?.items||[]).filter(x=>!x.removedAt);state.textContent=items.length?(pendingMaterials(c)?'素材已保存，请在右侧点击重新识别。':'补图已纳入识别，请核对右侧正文。'):c.scope?.missingMaterial?'待补图。不能根据品牌名猜造Logo。':'尚未补充素材。';
 for(const [i,item] of items.entries()){const row=text('div','','supplement-item'),preview=text('button','');preview.setAttribute('aria-label',c.caseId+' 查看补图'+(i+1));const img=document.createElement('img');img.src=item.asset;img.alt='图'+(c.images.length+(supplements[c.caseId]?.items||[]).findIndex(x=>x.id===item.id)+1)+'（补充） · '+item.target;preview.append(img);preview.onclick=()=>openImage(c,{...item,label:'补图'+(i+1),index:'补'+(i+1)});const remove=text('button','移除补图');remove.setAttribute('aria-label',c.caseId+' 移除补图'+(i+1));remove.onclick=async()=>{remove.disabled=true;try{await post({action:'remove',caseId:c.caseId,id:item.id,revision:supplements[c.caseId].revision});feedback.textContent='已移除补图，原始附件保留'}catch(error){feedback.textContent=error.message;feedback.classList.add('error');remove.disabled=false}};row.append(preview,text('p','图'+(c.images.length+(supplements[c.caseId]?.items||[]).findIndex(x=>x.id===item.id)+1)+'（补充） · '+item.target),text('p',item.name+' · '+item.width+'×'+item.height,'subtle'),remove);list.append(row)}
 const entry=cards.find(e=>e.c.caseId===c.caseId);if(entry){entry.card.querySelector('.status').textContent=items.length?'已补图 · 待重新识别':stateNames[c.result.status]||c.result.status;entry.select.querySelector('[value="checked"]').disabled=pendingMaterials(c);if(pendingMaterials(c)&&entry.select.value==='checked')entry.select.value='pending';entry.refreshLifecycle?.()}
 }
 button.onclick=async()=>{button.disabled=true;feedback.classList.remove('error');try{if(location.protocol==='file:')throw new Error('请从本地审阅服务打开页面后上传');if(!file.files.length)throw new Error('请先选择素材图片');if(!target.value.trim())throw new Error('请填写素材用于哪里');if(file.files[0].size>15*1024*1024)throw new Error('单张图片不能超过15MB');if(!pendingUpload){const selected=file.files[0];const data=await new Promise((done,fail)=>{const reader=new FileReader();reader.onload=()=>done(reader.result);reader.onerror=()=>fail(new Error('图片读取失败'));reader.readAsDataURL(selected)});pendingUpload={action:'upload',caseId:c.caseId,id:crypto.randomUUID(),name:selected.name,target:target.value.trim(),base64:data.slice(data.indexOf(',')+1),revision:supplements[c.caseId]?.revision||0}}
 await post(pendingUpload);file.value='';pendingUpload=null;feedback.textContent='补图已保存，可点击预览；刷新后仍保留。'}catch(error){feedback.textContent=error.message;feedback.classList.add('error')}finally{button.disabled=false}};
 if(location.protocol==='file:')button.disabled=true;render();return box;
}
async function api(path,payload){const response=await fetch(path,payload?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}:{});const value=await response.json();if(!response.ok)throw new Error(value.error||'请求失败');return value}
async function refreshA(){aStates=await api('/api/a-state');for(const entry of cards)entry.refreshLifecycle?.();applyFilter()}
function lifecyclePanel(entry){
 const {c,area}=entry,box=text('div','','supplement-box'),status=text('p','','subtle'),feedback=text('p','','feedback'),candidate=text('div',''),history=text('details',''),confirmationStatus=text('p','','subtle');
 feedback.setAttribute('role','status');history.append(text('summary','查看已确认的记录'));
 const run=text('button','补图后重新识别'),adopt=text('button','采用新结果并编辑'),confirmButton=text('button','确认并交给 B','primary');
 run.setAttribute('aria-label',c.caseId+' 重新识别');adopt.setAttribute('aria-label',c.caseId+' 采用新结果');confirmButton.setAttribute('aria-label',c.caseId+' 确认并交给B');
 const person=document.createElement('input');person.type='text';person.placeholder='核对人姓名（本地记录）';person.maxLength=80;person.setAttribute('aria-label',c.caseId+' 核对人');
 box.append(text('strong','核对与确认'),text('p','补图后可重新识别这一条。新结果先单独展示，不会自动替换已保存的正文。','subtle'),run,status,candidate,adopt,person,confirmButton,feedback,confirmationStatus,history);
 let lastId=null,pendingRunId=null,pendingConfirm=null;
 const payload=()=>({caseId:c.caseId,reviewRevision:reviews[c.caseId]?.revision||0,supplementRevision:supplements[c.caseId]?.revision||0});
 entry.refreshLifecycle=()=>{
  const state=aStates[c.caseId]||{},latest=state.analyses?.at(-1),confirmed=state.confirmations?.at(-1);
  run.disabled=latest?.status==='running';
  const accepted=state.analyses?.find(a=>a.id===reviews[c.caseId]?.analysisId);
  const pending=pendingMaterials(c);
  entry.card.querySelector('.status').textContent=latest?.status==='running'?'正在重新识别':pending?'素材已变化 · 待重新核对':isConfirmed(c)?'已确认 · B已接收':stateNames[c.result.status]||c.result.status;
  const supplementHint=entry.card.querySelector('.supplement-status');if(supplementHint&&hasSupplement(c))supplementHint.textContent=pending?'素材已保存，请重新识别并核对新结果。':'补图已纳入已保存的正文。';
  entry.select.querySelector('[value="checked"]').disabled=pending;
  if(pending&&entry.select.value==='checked')entry.select.value='pending';
  confirmButton.disabled=dirty.has(c.caseId)||!reviews[c.caseId]||pending||latest?.status==='running'||isConfirmed(c);
  if(!dirty.has(c.caseId))entry.select.value=effectiveState(c);
  const current=isConfirmed(c);
  if(latest){status.textContent=latest.status==='running'?'正在调用识图API，刷新后可继续查看进度。':latest.status==='returned'?`重新识别已返回 · ${(latest.elapsedMs/1000).toFixed(1)}秒。${accepted?.id===latest.id?'已采用并保存，可继续修改或确认。':'请查看下面的新结果，需要时采用并编辑。'}`:latest.error||latest.status;}

  candidate.hidden=accepted?.id===latest?.id;adopt.hidden=latest?.status!=='returned'||accepted?.id===latest?.id;adopt.disabled=accepted?.id===latest?.id;

 const rh=text('div','','column-heading'),rightTitle=text('h3','改写后的需求'),edit=text('button','修改图稿要求','edit-button'),editSave=text('button','保存修改','primary edit-button'),editActions=text('div','','modal-actions');edit.setAttribute('aria-label',c.caseId+' 修改图稿要求');editSave.setAttribute('aria-label',c.caseId+' 保存修改');editSave.hidden=true;editActions.append(edit,editSave);rh.append(rightTitle);if(defaultText(c))rh.append(editActions);right.append(rh);

 if(r.status==='failed'||r.status==='invalid_output')right.append(text('p',r.error||'返回未满足约定格式，原始内容保留供查看。','error-output'));

 const bar=text('div','','review-bar'),select=document.createElement('select');select.setAttribute('aria-label',c.caseId+' 审阅状态');for(const [value,label] of [['pending','尚未审阅'],['checked','已核对'],['needs_changes','需修改']]){const o=text('option',label);o.value=value;select.append(o)}select.value=effectiveState(c);if(pendingMaterials(c))select.querySelector('[value="checked"]').disabled=true;const save=text('button','保存修改与审阅','primary');save.setAttribute('aria-label',c.caseId+' 保存修改与审阅');bar.append(select,save);right.append(bar);

function applyFilter(){const q=$('search').value.toLocaleLowerCase().trim(),filter=$('filter').value,stage=$('scopeFilter').value;let visible=0,total=0,reviewed=0;for(const e of cards){const c=e.c,r=c.result,state=effectiveState(c);const inScope=!DATA.scope||stage==='all'||c.scope?.stage===stage;if(inScope){total++;if(state!=='pending')reviewed++}const match=!q||(c.caseId+' '+c.sourceText+' '+e.area.value).toLocaleLowerCase().includes(q);const pass=filter==='all'||filter==='audit_pass'&&c.audit?.status==='no_issue_found'||filter==='materials'&&(c.scope?.missingMaterial||hasSupplement(c))||filter==='differences'&&c.qaNotes?.length||filter==='issues'&&((r.parsed?.readingIssues||[]).length||(r.structuralObservations||[]).length)||filter==='failed'&&['failed','invalid_output'].includes(r.status)||filter==='unreviewed'&&state==='pending'||filter===state;e.card.hidden=!(inScope&&match&&pass);if(!e.card.hidden)visible++;const link=$('jump').querySelector('[href="#'+c.caseId+'"]');if(link)link.hidden=e.card.hidden} $('count').textContent=`显示 ${visible} / ${total} · 人工已审阅 ${reviewed}`;$('emptyList').hidden=visible!==0}
