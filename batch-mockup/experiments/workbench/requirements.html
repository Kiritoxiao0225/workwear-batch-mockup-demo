ssue strong{display:block;margin-bottom:3px}.future{background:#fcfdfb;color:#8a9990}.future strong{display:block;font-size:13px;font-weight:500;color:#7a8d81}.future p{font-size:12px;line-height:1.7;margin:6px 0}.future .dash{font-size:24px;color:#cad4cd;margin-bottom:5px}details{margin-top:12px;font-size:12px}summary{cursor:pointer;color:var(--green)}.empty{padding:45px;color:var(--muted);text-align:center}footer{padding:0 26px 18px;color:#7e8d84;font-size:12px}dialog{border:1px solid #b6cfbe;border-radius:12px;width:880px;max-width:calc(100vw - 28px);max-height:92vh;padding:24px;color:var(--ink);box-shadow:0 20px 90px #18372a30}dialog::backdrop{background:#10281e66}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.dialog-head h2{margin:0;font-size:19px}.edit-art{border:1px solid var(--line);padding:16px;margin:16px 0;border-radius:8px}.field-row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field-row label{flex:1;min-width:110px}.field-row input,.field-row select{width:100%}label{font-size:12px;color:#5f7769;display:block}textarea{width:100%;resize:vertical;min-height:225px;font-size:14px;line-height:1.8;margin:7px 0 10px}.app-row{display:flex;gap:6px;margin-top:6px}.app-row input{min-width:0;width:30%;font-size:12px}.refs{display:flex;gap:10px;flex-wrap:wrap;margin:7px 0}.refs label{display:flex;gap:5px;align-items:center;background:#f1f5f1;padding:4px 9px;border-radius:4px}.refs input{padding:0}.refs img{width:34px;height:30px;object-fit:contain}.issue-edit{margin:12px 0;padding:10px;background:var(--warm)}.issue-edit input,.issue-edit textarea{width:100%;margin:4px 0}.issue-edit textarea{min-height:65px}.remove{color:#8b5544;border-color:#d9c7bc;background:white;font-size:12px}.sticky-actions{position:sticky;bottom:-24px;padding:15px 0 5px;background:white;border-top:1px solid var(--line);z-index:2}.error{color:#a33d30;white-space:pre-wrap;font-size:13px}.image-wrap{background:#e3e9e2;display:grid;place-items:center;max-height:73vh;overflow:auto;padding:12px}.image-wrap.dark{background:#18211e}.image-wrap img{max-width:100%;max-height:69vh;object-fit:contain}.image-wrap img.native{max-width:none;max-height:none}#zoom{width:1100px}#prompt-content{white-space:pre-wrap;font-size:13px}.prompt-fields{margin:14px 0}.prompt-field{display:grid;grid-template-columns:42px minmax(0,1fr);gap:10px;align-items:start;border-top:1px solid #e6ece7;padding:9px 0}.prompt-field strong{font-size:13px;padding-top:9px;color:#365542}.prompt-field textarea{min-height:66px;margin:0;font-size:13px;line-height:1.6;field-sizing:content}.prompt-field textarea[data-section="文字"]{min-height:85px}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#244d3b;color:white;border-radius:8px;box-shadow:0 6px 30px #17302233;padding:10px 18px;z-index:20;display:none;max-width:90vw}.supplement-list{font-size:12px}.supplement-list p{display:flex;justify-content:space-between;gap:8px;align-items:center}@media(max-width:760px){header{padding:15px;align-items:flex-start;flex-direction:column;gap:12px}.stages span{padding:6px 8px}.toolbar{padding:12px}.scope{padding:0 12px 10px}.wrap{margin:0 10px 16px;max-height:calc(100vh - 260px)}.tools #search{width:190px}.field-row label{min-width:130px}dialog{padding:16px}.sticky-actions{bottom:-16px}.app-row{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<div class="toolbar"><div class="tools"><input id="search" aria-label="搜索原文、图稿或货号" placeholder="搜索原文、图稿或货号"><select id="filter" aria-label="筛选需求"><option value="all">当前待领取／未领取</option><option value="history">全部历史</option><option value="issue">有提醒</option></select><button id="refresh">刷新</button><button id="sync-wps">同步 WPS 原稿</button><button id="analyze-pending">识别未处理原稿</button><button id="generate-all" class="primary" hidden>生成全部图稿</button><button id="show-prompt">查看理解提示词</button></div><div id="counts" class="count"></div></div>

<div class="wrap"><table><colgroup><col style="width:20%"><col style="width:30%"><col style="width:23%"><col style="width:27%"></colgroup><thead><tr><th>原始资料<small>客服原文与完整原图</small></th><th><span class="step">1</span>需求理解<small>点击正文直接修改 · 自动保存</small></th><th><span class="step">2</span>生图<small>制作结果</small></th><th><span class="step">3</span>上衣效果图<small>正反面同框 · 拖动后自动保存</small></th></tr></thead><tbody id="rows"><tr><td colspan="4" class="empty">正在读取需求…</td></tr></tbody></table></div>
<footer><a href="../../wps-production/legacy" target="_top">旧版与历史记录</a> · 需求、修补与上衣排版分别保存。复制或下载不会将 WPS 任务自动标为已完成。</footer>
<dialog id="edit"><div class="dialog-head"><h2 id="edit-title">修改制作要求</h2><button data-close>关闭</button></div><p class="muted">正文在表格中直接编辑。这里仅调整款色、制作方式和素材关联。</p><div id="edit-arts"></div><button id="add-art">＋ 添加图稿</button><div id="edit-issues"></div><div class="sticky-actions"><div class="tools"><button id="save" class="primary">保存修改</button></div><p id="edit-error" class="error" role="alert"></p></div></dialog>

<dialog id="prompt-dialog"><div class="dialog-head"><h2>本批实际使用的理解提示词</h2><button data-close>关闭</button></div><p id="prompt-info" class="muted"></p><pre id="prompt-content"></pre></dialog>

<script type="module">
import {fieldNames,promptParts,replaceSection,changedText,createAutosave} from '/requirements-editor.mjs';
import {createRepairEditor} from '/repair-editor.mjs';
import {createMockupEditor} from '/mockup-editor.mjs';
const mockupEditor=createMockupEditor({api,onSaved:async()=>{await refresh()},toast});
const repairEditor=createRepairEditor({api,onSaved:async()=>{await refresh();toast('修补已保存，预览和下载已更新')}});
const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const routes={generate:'生图',enhance:'高清放大',reuse:'直接复用'};
let data, editing, uploadCase, timer, adopting=null, last='', editingBusy=false;
const busy=new Set();
const autosaves=new Map();
const find=id=>data.cases.find(c=>c.caseId===id);
function current(c){const s=autosaves.get(c.caseId)?.snapshot();return s?{...c,draft:s.draft,revision:s.revision}:c}
function inlineActive(){return !!document.activeElement?.closest('[data-inline]')}
function unsaved(){return [...autosaves.values()].some(s=>s.snapshot().pending)}
function saveUI(id,s){const row=document.getElementById(id);if(!row)return;const label=row.querySelector('[data-save-state]');label.classList.toggle('error',s.status==='error');label.textContent=s.status==='saved'?'已保存':s.status==='saving'?'保存中…':s.status==='error'?'保存失败：'+s.error:'正在编辑，稍后自动保存';row.querySelector('[data-action="retry-save"]').hidden=s.status!=='error'}
function writer(id){if(!autosaves.has(id)){const c=find(id);autosaves.set(id,createAutosave({initial:c,write:body=>api('/api/requirements/save',body),read:async caseId=>(await api('/api/requirements')).cases.find(x=>x.caseId===caseId),onChange:s=>{saveUI(id,s);if(s.status==='saved'){const c=find(id);c.revision=s.revision;c.draft=structuredClone(s.draft)}}}))}return autosaves.get(id)}
async function flushCase(id){const w=autosaves.get(id);return !w||await w.flush()}
async function flushAll(){return (await Promise.all([...autosaves.values()].map(w=>w.flush()))).every(Boolean)}
function fieldDiff(c,art,label,value){const baseline=c.modelDraft?.artworks.find(a=>a.id===art.id);const before=baseline?promptParts(baseline.prompt).parts.find(p=>p.label===label)?.value??value:'';return changedText(before,value)}
function diffHTML(d){return d.segments.map(s=>s.changed?`<span class="manual-text">${esc(s.text)}</span>`:esc(s.text)).join('')}
function inlinePrompt(c,art){const p=promptParts(art.prompt);return `<div class="inline-prompt" data-case="${esc(c.caseId)}" data-art="${esc(art.id)}"><div class="prompt-title">${esc(p.prefix.trimEnd())}</div>${p.parts.map(x=>{const d=fieldDiff(c,art,x.label,x.value);return `<div class="inline-line"><div class="inline-label">${x.label}：<span class="deleted-note" ${d.deleted?'':'hidden'}>有删减</span></div><div role="textbox" aria-label="${esc(c.caseId+' '+art.name+' '+x.label)}" aria-multiline="true" contenteditable="plaintext-only" spellcheck="false" class="inline-value" data-inline data-case="${esc(c.caseId)}" data-art="${esc(art.id)}" data-section="${x.label}" data-gap="${esc(x.gap)}">${diffHTML(d)}</div></div>`}).join('')}</div>`}
function paintField(el){const c=current(find(el.dataset.case)),a=c.draft.artworks.find(a=>a.id===el.dataset.art),v=promptParts(a.prompt).parts.find(p=>p.label===el.dataset.section).value,d=fieldDiff(c,a,el.dataset.section,v);el.innerHTML=diffHTML(d);el.previousElementSibling.querySelector('.deleted-note').hidden=!d.deleted}
function recordField(el){const w=writer(el.dataset.case),d=structuredClone(w.snapshot().draft),a=d.artworks.find(a=>a.id===el.dataset.art);a.prompt=replaceSection(a.prompt,el.dataset.section,el.textContent===''?'':el.innerText.replace(/\r\n/gu,'\n'),el.dataset.gap);w.update(d)}
document.addEventListener('focusin',e=>{if(e.target.matches('[data-inline]'))writer(e.target.dataset.case)});
document.addEventListener('input',e=>{if(e.target.matches('[data-inline]')&&!e.isComposing)recordField(e.target)});
document.addEventListener('compositionend',e=>{if(e.target.matches('[data-inline]'))recordField(e.target)});
document.addEventListener('focusout',e=>{if(e.target.matches('[data-inline]')){paintField(e.target);void flushCase(e.target.dataset.case)}});
document.addEventListener('change',e=>{if(e.target.matches('[data-resolve-inline]')&&e.target.checked){const w=writer(e.target.dataset.case),d=structuredClone(w.snapshot().draft);d.readingIssues.splice(Number(e.target.dataset.resolveInline),1);w.update(d);void w.flush().then(()=>render())}});
window.addEventListener('beforeunload',e=>{if(unsaved()){e.preventDefault();e.returnValue=''}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)void flushAll()});
function toast(text){$('#toast').textContent=text;$('#toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('#toast').style.display='none',6000)}
async function api(path,body){const r=await fetch(path,body===undefined?{cache:'no-store'}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Object.assign(Error(d.error||'操作未完成，请刷新确认保存状态'),{status:r.status});return d}
function promptHTML(text){return text.split('\n').map(line=>{if(/^【.*】$/u.test(line))return `<span class="prompt-title">${esc(line)}</span>`;const m=line.match(/^(主体|文字|字体|颜色|排版|尺寸|输出)：/u);return m?`<span class="prompt-label">${esc(m[0])}</span>${esc(line.slice(m[0].length))}`:esc(line)}).join('\n')}
function applicationHTML(items){const groups=new Map();for(const x of items){const key=JSON.stringify([x.style,x.position]);if(!groups.has(key))groups.set(key,{style:x.style,position:x.position,colors:[]});const group=groups.get(key);if(x.color&&!group.colors.includes(x.color))group.colors.push(x.color)}return [...groups.values()].map(g=>esc([g.style,g.colors.join('／'),g.position].filter(Boolean).join(' · '))).join('<br>')}
function imageButtons(c){return c.images.map(i=>`<button class="asset" data-action="zoom" data-case="${esc(c.caseId)}" data-image="${esc(i.id)}"><img src="/${esc(i.asset)}" alt="${esc(i.label)}" loading="lazy"><span>${esc(i.label)}${i.source==='designer_upload'?' · 补图':''}</span></button>`).join('')}
function productionHTML(c){
const labels={queued:'排队中',running:'制作中',returned:'已返回 · 待看图',partial:'已有原图 · 抠图未完成',blocked:'缺少制作条件',failed:'制作失败',unknown:'结果未知 · 未重试'};
return (c.draft?.artworks||[]).map(a=>{const j=c.productions?.filter(j=>j.artworkId===a.id).at(-1),file=j?.repair?.file||j?.final||j?.raw;
return `<div class="production-card"><h3>${esc(a.name)}</h3>${j?`<div class="production-state">${labels[j.status]}${j.elapsedMs?' · '+(j.elapsedMs/1000).toFixed(1)+' 秒':''}${j.status==='running'?' · '+({generate:'生图',enhance:'高清放大',cutout:'美图抠图'}[j.phase]||'准备中'):''}</div>${j.revision!==c.revision||j.supplementRevision!==c.supplement.revision?'<div class="issue">要求已修改，此图使用的是之前保存的版本。</div>':''}${file?`<button class="production-image" data-action="result-zoom" data-case="${esc(c.caseId)}" data-job="${j.id}" data-kind="${j.repair?'repair':j.final?'final':'raw'}"><img src="/${esc(file.asset)}" loading="lazy" alt="${esc(c.caseId+' '+a.name+' 制作结果')}"></button><div class="production-links"><a href="/${esc(file.asset)}" download>下载图片</a>${j.raw&&!['running','queued','unknown'].includes(j.status)?`<button data-action="repair" data-case="${esc(c.caseId)}" data-job="${j.id}">局部修补</button>`:''}${j.raw&&j.final&&j.raw.asset!==j.final.asset?`<button data-action="result-zoom" data-case="${esc(c.caseId)}" data-job="${j.id}" data-kind="raw">查看抠图前原图</button>`:''}</div><small>${file.width} × ${file.height}</small>${j.repair?`<div class="repair-label">已人工修补 · v${j.repair.revision} · 待看图</div>`:''}`:''}${j.error?`<div class="issue">${esc(j.error)}</div>`:''}${j.warning?`<div class="issue">${esc(j.warning)}</div>`:''}${data.productionReview?.[j.id]?`<div class="issue"><strong>${j.repair?'原始抠图初查 · 修补后请重新看图':'Codex 看图初查 · 非模型评分'}</strong>${esc(data.productionReview[j.id].note)}</div>`:''}`:'<div class="production-empty">尚未制作</div>'}</div>`}).join('')+`<div class="actions"><button data-action="generate" data-case="${esc(c.caseId)}" ${!data.generationEnabled?'disabled':''}>生成当前要求</button></div>`;
}
function render(){if(!data||inlineActive()||mockupEditor.isEditing())return;const q=$('#search').value.toLowerCase(),filter=$('#filter').value;
const list=data.cases.map(current).filter(c=>JSON.stringify([c.caseId,c.sourceText,c.draft]).toLowerCase().includes(q)).filter(c=>filter==='history'||c.active!==false).filter(c=>filter==='all'||filter==='history'||filter==='issue'&&(c.draft?.readingIssues.length||c.notes.length||c.needsReanalysis||c.analysis?.error));
$('#counts').textContent=`${data.cases.length} 条需求　${data.cases.filter(c=>c.draft).length} 条已返回`;
$('#scope').textContent=`${(data.run.imageCount||0)} 张原始素材 · WPS 读取于 ${(data.run.sourceReadAt?new Date(data.run.sourceReadAt).toLocaleString('zh-CN'):'尚未同步')} · ${data.storage==='cloud'?'正式存储':'本机验收'} · 当前显示 ${list.length} 条`;
const allJobs=data.cases.flatMap(c=>c.productions||[]),totals=allJobs.reduce((r,j)=>(r[j.status]=(r[j.status]||0)+1,r),{});if(allJobs.length)$('#counts').textContent=`${data.cases.length} 条需求 · ${allJobs.length} 份图稿 · 已返回 ${totals.returned||0} · 处理中 ${totals.running||0} · 排队 ${totals.queued||0} · 未完成 ${(totals.blocked||0)+(totals.failed||0)+(totals.partial||0)+(totals.unknown||0)}`;
const syncing=data.activity?.find(x=>x.kind==='sync');if(syncing&&['queued','running','failed','unknown'].includes(syncing.status))$('#scope').textContent+=' · WPS 同步'+({queued:'排队中',running:'正在读取',failed:'失败，请重新同步',unknown:'中断，请重新同步'}[syncing.status]);if(data.run.syncErrors?.length)$('#scope').textContent+=' · '+data.run.syncErrors.length+' 条原稿未能完整读取，请重新同步';const failedMockups=new Set((data.activity||[]).filter(x=>x.kind==='mockup'&&['failed','unknown'].includes(x.status)).map(x=>x.caseId));if(failedMockups.size)$('#scope').textContent+=' · 效果图合成异常：'+[...failedMockups].join('、')+'，可点更新效果图重试';$('#generate-all').hidden=!data.generationEnabled;if(data.storage==='cloud'&&data.workerOnline===false)$('#scope').textContent+=' · 后台暂未在线，已提交任务保留排队';
const opened=new Set([...document.querySelectorAll('details[open]')].map(x=>x.dataset.detail));
$('#rows').innerHTML=list.map(c=>{const a=c.analysis,status=c.needsReanalysis?'补图后待识别':a?.status==='running'?'识别中':c.draft?'':a?.error?'识别未完成':'待识别';
return `<tr id="${esc(c.caseId)}"><td class="source"><div class="meta"><span class="case-id">${esc(c.caseId)}</span><span class="pill">${esc(c.wpsStatus)}</span></div><div class="original">${esc(c.sourceText)}</div><div class="assets">${imageButtons(c)}</div>${c.sourceChanged?`<div class="issue">WPS 原稿已更新，当前修改保留。<button data-action="adopt-source" data-case="${esc(c.caseId)}">载入最新原稿</button></div>`:''}${c.sourceReadError?`<div class="issue">${esc(c.sourceReadError)}</div>`:''}${!c.images.length?'<p class="muted">尚未提供图片素材</p>':''}<div class="actions"><button data-action="upload" data-case="${esc(c.caseId)}">补充素材</button></div><details data-detail="source-${esc(c.caseId)}"><summary>来源记录</summary>${esc(c.sourceRecordId)}</details></td>
<td><div class="meta save-row"><span data-save-state class="save-state" role="status">${c.draft?'已保存':''}</span><button data-action="retry-save" data-case="${esc(c.caseId)}" hidden>重试保存</button>${status?`<span class="pill warn">${status}</span>`:''}<span class="muted">${a?.elapsedMs?(a.elapsedMs/1000).toFixed(1)+' 秒':''}</span></div>
${(c.draft?.artworks||[]).map(art=>`<article class="artwork" data-artwork="${esc(art.id)}"><div class="art-meta"><div class="application">${applicationHTML(art.applications)}</div><span class="route">${routes[art.route]}</span></div>${inlinePrompt(c,art)}</article>`).join('')}
${c.draft?'<div class="inline-help">点击正文直接修改 · <span class="manual-key">红色粗体</span>为人工改动，标记不传给模型。</div>':'<p class="muted">'+(a?.status==='running'?'正在结合原文和全部图片理解需求…':'尚未取得新版制作正文')+'</p>'}
${(c.draft?.readingIssues||[]).map((i,index)=>`<div class="issue"><strong>${esc(i.scope)}</strong>${esc(i.issue)}<label class="resolved-inline"><input type="checkbox" data-resolve-inline="${index}" data-case="${esc(c.caseId)}">已核对处理此提醒</label></div>`).join('')}
${c.needsReanalysis?'<div class="issue">素材已变化。请重新识别本条，再采用并核对新结果。</div>':''}
${c.notes.map(n=>`<div class="issue"><strong>Codex 初审提醒 · 非模型评分</strong>${esc(typeof n==='string'?n:n.message)}</div>`).join('')}
${a?.error?`<div class="issue">${esc(a.error)}</div>`:''}
<div class="actions"><button data-action="analyze" data-case="${esc(c.caseId)}" ${a?.status==='running'||busy.has(c.caseId)?'disabled':''}>${c.draft?'重新识别本条':'识别本条'}</button>${a?.proposedDraft?`<button data-action="adopt" data-case="${esc(c.caseId)}">查看新识别结果</button>`:''}</div><details class="more-settings" data-detail="settings-${esc(c.caseId)}"><summary>其他设置</summary><div class="actions"><button data-action="edit" data-case="${esc(c.caseId)}" ${!c.draft?'disabled':''}>款色、路线与素材关联</button></div></details></td>
<td>${productionHTML(c)}</td><td>${mockupEditor.html(c)}</td></tr>`}).join('')||'<tr><td colspan="4" class="empty">没有匹配的需求</td></tr>';
mockupEditor.hydrate(list);
for(const el of document.querySelectorAll('details'))if(opened.has(el.dataset.detail))el.open=true;for(const [id,w] of autosaves)saveUI(id,w.snapshot());
}
let productionReview={},reviewRequested=false;
async function refresh(){if(inlineActive()||unsaved()||mockupEditor.isEditing())return;const next=await api('/api/requirements');next.productionReview=productionReview;if(inlineActive()||unsaved()||mockupEditor.isEditing())return;const sig=JSON.stringify(next);data=next;autosaves.clear();if(sig!==last){last=sig;render()}
// Optional historical notes must never delay the actual workbench or its saving feedback.
if(!reviewRequested){reviewRequested=true;void api('/production-review.json').then(notes=>{productionReview=notes;if(data){data.productionReview=notes;last='';render()}}).catch(()=>{reviewRequested=false;});}}

function appRow(x){return `<div class="app-row"><input data-field="style" aria-label="款式货号" placeholder="款式货号" value="${esc(x.style)}"><input data-field="color" aria-label="衣色" placeholder="衣色" value="${esc(x.color)}"><input data-field="position" aria-label="应用位置" placeholder="应用位置" value="${esc(x.position)}"><button type="button" class="remove" data-remove-app>移除</button></div>`}

function promptEditor(a){const p=promptParts(a.prompt);if(!p)return `<label style="margin-top:12px">完整制作正文<textarea data-field="prompt" aria-label="完整制作正文">${esc(a.prompt)}</textarea></label>`;return `<div class="prompt-fields" data-parts="${esc(JSON.stringify(p))}" data-name="${esc(a.name)}">${p.parts.map(x=>`<label class="prompt-field"><strong>${esc(x.label)}</strong><textarea data-section="${esc(x.label)}" aria-label="${esc(x.label)}要求" spellcheck="false">${esc(x.value)}</textarea></label>`).join('')}</div>`}
function editedPrompt(el){const fields=el.querySelector('.prompt-fields');if(!fields){const raw=el.querySelector('[data-field="prompt"]')?.value??el.dataset.prompt,name=el.querySelector('[data-field="name"]').value;return name===el.dataset.name?raw:raw.replace(/^【[^\n]+】/u,()=> '【'+name+'】')}const p=JSON.parse(fields.dataset.parts),name=el.querySelector('[data-field="name"]').value;let prefix=p.prefix;if(name!==fields.dataset.name)prefix=prefix.replace(/^【[^\n]+】/u,()=> '【'+name+'】');return prefix+p.parts.map(x=>x.label+'：'+fields.querySelector(`[data-section="${x.label}"]`).value+x.gap).join('')}

function artEditor(a){return `<div class="edit-art" data-id="${esc(a.id)}" data-prompt="${esc(a.prompt)}" data-name="${esc(a.name)}"><div class="field-row"><label>图稿名称<input data-field="name" value="${esc(a.name)}"></label><label>制作方式<select data-field="route">${Object.entries(routes).map(([v,n])=>`<option value="${v}" ${a.route===v?'selected':''}>${n}</option>`).join('')}</select></label><button class="remove" data-remove-art>删除此图稿</button></div>${adopting?promptEditor(a):''}<label>应用款色与位置</label><div class="applications">${a.applications.map(appRow).join('')}</div><button data-add-app style="margin-top:6px;font-size:12px">＋ 添加应用</button><label style="margin-top:12px">参与制作的参考图（与正文图号一致）</label><div class="refs">${editing.images.map(i=>`<label><input type="checkbox" data-ref="${esc(i.id)}" ${a.imageIds.includes(i.id)?'checked':''}><img src="/${esc(i.asset)}" alt="">${esc(i.label)}</label>`).join('')||'<span class="muted">暂无素材，可在原始资料列补充</span>'}</div></div>`}
function openEdit(c,draft=c.draft,analysisId=null){editing=structuredClone(c);adopting=analysisId;$('#edit-title').textContent=c.caseId+(analysisId?' · 核对新识别候选':' · 图稿设置');$('#edit-arts').innerHTML=draft.artworks.map(artEditor).join('');$('#edit-issues').innerHTML=draft.readingIssues.map(i=>`<div class="issue-edit"><strong>识别问题</strong><input aria-label="问题范围" data-scope value="${esc(i.scope)}"><textarea aria-label="问题说明" data-issue>${esc(i.issue)}</textarea><label><input type="checkbox" data-resolved> 我已处理此项，保存时移除提醒</label></div>`).join('');$('#edit-error').textContent='';$('#edit').showModal()}
function collectDraft(){return{artworks:[...$('#edit-arts').children].map(el=>({id:el.dataset.id,name:el.querySelector('[data-field="name"]').value,route:el.querySelector('[data-field="route"]').value,prompt:editedPrompt(el),applications:[...el.querySelectorAll('.app-row')].map(row=>Object.fromEntries(['style','color','position'].map(k=>[k,row.querySelector(`[data-field="${k}"]`).value]))),imageIds:[...el.querySelectorAll('[data-ref]:checked')].map(x=>x.dataset.ref)})),readingIssues:[...document.querySelectorAll('.issue-edit')].filter(x=>!x.querySelector('[data-resolved]').checked).map(x=>({scope:x.querySelector('[data-scope]').value,issue:x.querySelector('[data-issue]').value}))}}
async function save(){if(editingBusy)return;editingBusy=true;$('#save').disabled=true;try{const body={caseId:editing.caseId,revision:editing.revision,supplementRevision:editing.supplement.revision,draft:collectDraft()};if(adopting)body.analysisId=adopting;const saved=await api('/api/requirements/save',body);editing.revision=saved.revision;autosaves.delete(editing.caseId);adopting=null;$('#edit').close();await refresh();toast('修改已保存')}catch(e){$('#edit-error').textContent=e.message}finally{editingBusy=false;$('#save').disabled=false}}
function showSupplements(){const c=find(uploadCase.caseId);uploadCase=structuredClone(c);$('#supplement-list').innerHTML=c.supplement.items.filter(x=>!x.removedAt).map(i=>`<p><span>${esc(i.name)} · ${esc(i.target)}</span><button class="remove" data-remove-supplement="${esc(i.id)}">移除补图</button></p>`).join('')}
document.addEventListener('click',async e=>{const close=e.target.closest('[data-close]');if(close){close.closest('dialog').close();return}const rmArt=e.target.closest('[data-remove-art]');if(rmArt){rmArt.closest('.edit-art').remove();return}const add=e.target.closest('[data-add-app]');if(add){add.previousElementSibling.insertAdjacentHTML('beforeend',appRow({style:'',color:'',position:''}));return}const rmApp=e.target.closest('[data-remove-app]');if(rmApp){rmApp.closest('.app-row').remove();return}const rmSup=e.target.closest('[data-remove-supplement]');if(rmSup){try{await api('/api/supplements',{caseId:uploadCase.caseId,revision:uploadCase.supplement.revision,action:'remove',id:rmSup.dataset.removeSupplement});await refresh();showSupplements();toast('补图已移除，历史文件保留')}catch(err){$('#upload-error').textContent=err.message}return}const b=e.target.closest('[data-action]');if(!b)return;let c=find(b.dataset.case);try{if(b.dataset.action==='retry-save'){await writer(c.caseId).retry();return}if(!await flushCase(c.caseId)&&b.dataset.action!=='edit'){toast('当前修改尚未保存，请先处理保存提示');return}c=current(find(c.caseId));switch(b.dataset.action){case'adopt-source':await api('/api/wps/adopt',{caseId:c.caseId,revision:c.revision});await refresh();toast('已载入新的原稿，旧修改已保留；请重新识别');break;case'repair':await repairEditor.open(b.dataset.job);break;case'generate':await api('/api/production',{requests:[{caseId:c.caseId,revision:c.revision,supplementRevision:c.supplement.revision}]});await refresh();toast('已提交当前要求；同一版本不会重复制作');break;case'result-zoom':{const j=c.productions.find(j=>j.id===b.dataset.job),f=b.dataset.kind==='repair'?j.repair.file:j[b.dataset.kind];$('#zoom-title').textContent=c.caseId+' · '+j.name+(b.dataset.kind==='raw'?' · 抠图前原图':' · 制作结果');$('#zoom-image').src='/'+f.asset;$('#zoom-image').classList.remove('native');$('#zoom').showModal();break}case'zoom':{const i=c.images.find(i=>i.id===b.dataset.image);$('#zoom-title').textContent=c.caseId+' · '+i.label;$('#zoom-image').src='/'+i.asset;$('#zoom-image').classList.remove('native');$('#zoom').showModal();break}case'edit':openEdit(c);break;case'adopt':openEdit(c,c.analysis.proposedDraft,c.analysis.id);break;case'upload':uploadCase=c;$('#upload-file').value='';$('#upload-target').value='';$('#upload-error').textContent='';showSupplements();$('#upload').showModal();break;case'analyze':busy.add(c.caseId);render();try{await api('/api/requirements/analyze',{caseId:c.caseId,revision:c.revision,supplementRevision:c.supplement.revision,requestId:crypto.randomUUID()});toast('已提交真实识别；新结果不会覆盖已保存的修改')}finally{busy.delete(c.caseId);await refresh();render()}break}}catch(err){toast(err.message)}});
$('#save').onclick=()=>save();$('#add-art').onclick=()=>$('#edit-arts').insertAdjacentHTML('beforeend',artEditor({id:'a_'+crypto.randomUUID().replaceAll('-',''),name:'新图稿',route:'generate',applications:[{style:'',color:'',position:''}],imageIds:[],prompt:'【新图稿】\n\n主体：\n\n文字：\n\n字体：\n\n颜色：\n\n排版：\n\n尺寸：\n\n输出：一张独立平面图稿，不包含服装、模特或效果图模板。'}));
$('#generate-all').onclick=async()=>{const b=$('#generate-all');b.disabled=true;try{if(!await flushAll())throw Error('请先处理未保存内容');const latest=await api('/api/requirements');await api('/api/production',{requests:latest.cases.filter(c=>c.active!==false&&c.draft&&!c.sourceChanged&&!c.sourceReadError).map(c=>({caseId:c.caseId,revision:c.revision,supplementRevision:c.supplement.revision}))});await refresh();toast('已提交全部图稿；同一版本不重复制作')}catch(e){toast(e.message)}finally{b.disabled=false}};
$('#search').oninput=render;$('#filter').onchange=render;$('#refresh').onclick=async()=>{try{if(!await flushAll())throw Error('有未保存修改，请先处理保存提示；当前文字已保留');await refresh();toast('已回读最新保存内容')}catch(e){toast(e.message)}};
$('#native').onclick=()=>$('#zoom-image').classList.toggle('native');$('#backdrop').onclick=()=>$('.image-wrap').classList.toggle('dark');
$('#analyze-pending').onclick=async()=>{const b=$('#analyze-pending');b.disabled=true;try{if(!await flushAll())throw Error('请先处理未保存修改');const pending=(await api('/api/requirements')).cases.filter(c=>c.active!==false&&!c.draft&&c.analysis?.status!=='running'&&!c.sourceReadError);let submitted=0,failed=0;for(const c of pending){try{await api('/api/requirements/analyze',{caseId:c.caseId,revision:c.revision,supplementRevision:c.supplement.revision,requestId:crypto.randomUUID()});submitted++;}catch{failed++;}b.textContent=`已提交 ${submitted} / ${pending.length}`;}toast(`已提交 ${submitted} 条，${failed} 条未提交；原有修改保留`);await refresh();}catch(e){toast(e.message);}finally{b.disabled=false;b.textContent='识别未处理原稿';}};
$('#sync-wps').onclick=async()=>{try{await api('/api/wps/sync',{});toast('已提交原表同步，已有人工修改会保留')}catch(e){toast(e.message)}};
$('#show-prompt').onclick=async()=>{try{const p=await api('/api/prompt');$('#prompt-info').textContent=`CLIProxy · gpt-5.6-sol · low · SHA-256 ${p.sha256}`;$('#prompt-content').textContent=p.text;$('#prompt-dialog').showModal()}catch(e){toast(e.message)}};
$('#upload-save').onclick=async()=>{const button=$('#upload-save');button.disabled=true;try{const file=$('#upload-file').files[0];if(!file)throw Error('请选择图片');if(file.size>15*1024*1024)throw Error('单张图片不能超过15MB');const target=$('#upload-target').value;if(!target.trim())throw Error('请填写这张素材用于哪里');const base64=await new Promise((done,fail)=>{const reader=new FileReader();reader.onload=()=>done(String(reader.result).split(',')[1]);reader.onerror=()=>fail(Error('无法读取文件'));reader.readAsDataURL(file)});const id=crypto.randomUUID(),metadata={caseId:uploadCase.caseId,revision:uploadCase.supplement.revision,action:'upload',id,name:file.name,target};if(base64.length>3000000&&data.storage==='cloud'){const size=1400000,count=Math.ceil(base64.length/size);for(let n=0;n<count;n++)await api('/api/supplements/chunk',{id,index:n,base64:base64.slice(n*size,(n+1)*size)});await api('/api/supplements',{...metadata,uploadId:id,chunkCount:count});}else await api('/api/supplements',{...metadata,base64});await refresh();showSupplements();$('#upload-file').value='';toast('补图已保存，请重新识别本条并核对新结果')}catch(e){$('#upload-error').textContent=e.message}finally{button.disabled=false}};
await refresh().catch(e=>{$('#rows').innerHTML='<tr><td colspan="4" class="empty">读取失败，请点击刷新。</td></tr>';toast(e.message)});
if(location.hash){document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView({block:'start'})}
setInterval(()=>{if(document.hidden||document.querySelector('dialog[open]')||inlineActive()||unsaved())return;refresh().catch(()=>{})},5000);
</script>
</html>
