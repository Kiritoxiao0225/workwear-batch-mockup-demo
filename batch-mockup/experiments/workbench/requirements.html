<script type="module">
import {fieldNames,promptParts,replaceSection,changedText,createAutosave} from '/requirements-editor.mjs';
import {createRepairEditor} from '/repair-editor.mjs';
import {artworkPreviewTone} from '/preview-tone.mjs';
import {createMockupEditor} from '/mockup-editor.mjs';
const mockupEditor=createMockupEditor({api,onSaved:async()=>{await refresh()},toast});
const repairEditor=createRepairEditor({api,onSaved:async()=>{await refresh();toast('修补已保存，预览和下载已更新')}});
const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const selectedArt=new Map(),expandedRows=new Set();let drawerCase=null;
let data, editing, uploadCase, timer, adopting=null, last='', editingBusy=false;
const busy=new Set();
const autosaves=new Map();
const find=id=>data.cases.find(c=>c.caseId===id);
function current(c){const s=autosaves.get(c.caseId)?.snapshot();return s?{...c,draft:s.draft,revision:s.revision}:c}
function inlineActive(){return !!document.activeElement?.closest('[data-inline]')}
function unsaved(){return [...autosaves.values()].some(s=>s.snapshot().pending)}
function saveUI(id,s){if(drawerCase===id)$('#drawer-save').textContent=s.status==='saved'?'已保存':s.status==='error'?'保存失败：'+s.error:s.status==='saving'?'保存中…':'正在编辑，稍后自动保存';const row=document.getElementById(id);if(!row)return;const label=row.querySelector('[data-save-state]');label.classList.toggle('error',s.status==='error');label.textContent=s.status==='saved'?'已保存':s.status==='saving'?'保存中…':s.status==='error'?'保存失败：'+s.error:'正在编辑，稍后自动保存';row.querySelector('[data-action="retry-save"]').hidden=s.status!=='error'}
function writer(id){if(!autosaves.has(id)){const c=find(id);autosaves.set(id,createAutosave({initial:c,write:body=>api('/api/requirements/save',body),read:async caseId=>(await api('/api/requirements')).cases.find(x=>x.caseId===caseId),onChange:s=>{saveUI(id,s);if(s.status==='saved'){const c=find(id);c.revision=s.revision;c.draft=structuredClone(s.draft)}}}))}return autosaves.get(id)}
async function flushCase(id){const w=autosaves.get(id);return !w||await w.flush()}
async function flushAll(){return (await Promise.all([...autosaves.values()].map(w=>w.flush()))).every(Boolean)}
function fieldDiff(c,art,label,value){const baseline=c.modelDraft?.artworks.find(a=>a.id===art.id);const before=baseline?promptParts(baseline.prompt).parts.find(p=>p.label===label)?.value??value:'';return changedText(before,value)}
// Three marks, one action each. Green: OCR read the same printed words, no look needed. Yellow: only the model read
// them, look at the source image. Red: characters nobody could read (□, or a 文字 sentence saying so), must be filled
// in before production (production.mjs holds the same wording). Green and yellow apply to quoted 文字 text once OCR
// ran; red applies anywhere. The customer's own words stay plain.
const UNREADABLE=/无法[^，。；\n]{0,8}(辨认|辨别|识别|确认|确定)|看不清|待[^，。；\n]{0,6}补入/u,UNREAD_SENTENCE=new RegExp(`[^。；\\n]*(?:${UNREADABLE.source})[^。；\\n]*`,'gu');
const meaningful=t=>/[\u3400-\u9fff]/u.test(t)?(t.match(/[\u3400-\u9fff]/gu).length>=2):t.replace(/[^A-Za-z0-9]/gu,'').length>=3;
// Whole lines and their words: OCR keeps decoration ("—METAL INDUSTRIES—") the fields leave out.
function textMarks(c){const words=[...new Set(Object.values(c.imageText||{}).flat().flatMap(x=>[x.text.replace(/\s+/gu,'').replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,''),...x.text.split(/[^\p{L}\p{N}]+/u)]).filter(meaningful))].sort((a,b)=>b.length-a.length);return {checked:!!c.imageText,ocr:words.length?new RegExp(words.map(w=>Array.from(w,ch=>ch.replace(/[.*+?^${}()|[\]\\]/gu,'\\$&')).join('\\s*')).join('|'),'gu'):null,source:String(c.sourceText||'').replace(/\s+/gu,''),lines:Object.values(c.imageText||{}).flat().map(x=>x.text.replace(/\s+/gu,''))}}
function markedHTML(text,marks,label){const spans=[],covered=(a,b)=>spans.some(([x,y])=>x<b&&y>a),ocr=marks?.checked&&marks.ocr?[...text.matchAll(marks.ocr)].map(m=>[m.index,m.index+m[0].length]):[];
 if(label==='文字')for(const m of text.matchAll(UNREAD_SENTENCE))if(m[0].trim())spans.push([m.index,m.index+m[0].length,'fix']);
 if(label==='文字')for(const m of text.matchAll(/[“「]([^”」]+)[”」]/gu)){const a=m.index+1,b=a+m[1].length,q=m[1].replace(/\s+/gu,'');
  if(covered(a,b))continue;
  if(q.includes('□'))spans.push([a,b,'fix']);
  else if(!marks?.checked||!/[\p{L}\p{N}]/u.test(q))continue;
  else if([...m[1]].every((ch,i)=>!/[\p{L}\p{N}]/u.test(ch)||ocr.some(([x,y])=>x<=a+i&&a+i<y))||marks.lines.some(l=>l.includes(q)))spans.push([a,b,'ok']);
  else if(!marks.source.includes(q))spans.push([a,b,'check'])}
 for(const m of text.matchAll(/□+/gu))if(!covered(m.index,m.index+m[0].length))spans.push([m.index,m.index+m[0].length,'fix']);
 // Lines written without quotes ("按图2逐行制作：\n中秋国庆双节快乐") are still green where OCR read them.

let productionReview={},reviewRequested=false,refreshesInFlight=0;
async function refresh(){refreshesInFlight++;try{await readWorkbench();}finally{refreshesInFlight--;}}
async function readWorkbench(){if(inlineActive()||unsaved()||mockupEditor.isEditing()||$('#requirement-drawer').open)return;const mockupEpoch=mockupEditor.epoch();const next=await api('/api/requirements');next.productionReview=productionReview;if(inlineActive()||unsaved()||mockupEditor.isEditing()||$('#requirement-drawer').open||mockupEpoch!==mockupEditor.epoch())return;const sig=JSON.stringify(next);data=next;autosaves.clear();if(sig!==last){last=sig;render()}
// Optional historical notes must never delay the actual workbench or its saving feedback.
if(!reviewRequested){reviewRequested=true;void api('/production-review.json').then(notes=>{productionReview=notes;if(data){data.productionReview=notes;last='';render()}}).catch(()=>{reviewRequested=false;});}}

function appRow(x){const ref=x.sizeReference;return `<div class="app-row"${ref?` data-size-reference="${esc(JSON.stringify(ref))}"`:''}><input data-field="style" aria-label="款式货号" placeholder="款式货号" value="${esc(x.style)}"><input data-field="color" aria-label="衣色" placeholder="衣色" value="${esc(x.color)}"><input data-field="position" aria-label="应用位置" placeholder="应用位置" value="${esc(x.position)}"><button type="button" class="remove" data-remove-app>移除</button>${ref?`<small class="size-ref">效果图尺寸按参考图比例：${esc(ref.note||'约占衣身宽'+Math.round(ref.logoToBody*100)+'%')} <button type="button" class="remove" data-remove-size-ref>不按参考图</button></small>`:''}</div>`}

function promptEditor(a){const p=promptParts(a.prompt);if(!p)return `<label style="margin-top:12px">完整制作正文<textarea data-field="prompt" aria-label="完整制作正文">${esc(a.prompt)}</textarea></label>`;return `<div class="prompt-fields" data-parts="${esc(JSON.stringify(p))}" data-name="${esc(a.name)}">${p.parts.map(x=>`<label class="prompt-field"><strong>${esc(x.label)}</strong><textarea data-section="${esc(x.label)}" aria-label="${esc(x.label)}要求" spellcheck="false">${esc(x.value)}</textarea></label>`).join('')}</div>`}
function editedPrompt(el){const fields=el.querySelector('.prompt-fields');if(!fields){const raw=el.querySelector('[data-field="prompt"]')?.value??el.dataset.prompt,name=el.querySelector('[data-field="name"]').value;return name===el.dataset.name?raw:raw.replace(/^【[^\n]+】/u,()=> '【'+name+'】')}const p=JSON.parse(fields.dataset.parts),name=el.querySelector('[data-field="name"]').value;let prefix=p.prefix;if(name!==fields.dataset.name)prefix=prefix.replace(/^【[^\n]+】/u,()=> '【'+name+'】');return prefix+p.parts.map(x=>x.label+'：'+fields.querySelector(`[data-section="${x.label}"]`).value+x.gap).join('')}

function artEditor(a){return `<div class="edit-art" data-id="${esc(a.id)}" data-prompt="${esc(a.prompt)}" data-name="${esc(a.name)}"><div class="field-row"><label>图稿名称<input data-field="name" value="${esc(a.name)}"></label><label>制作方式<select data-field="route">${Object.entries(routes).map(([v,n])=>`<option value="${v}" ${a.route===v?'selected':''}>${n}</option>`).join('')}</select></label><label title="复杂或看不清的中文需要重画时勾选，每张约 ¥0.25"><input type="checkbox" data-field="quality" ${a.quality==='high'?'checked':''}>高质量生成</label><button class="remove" data-remove-art>删除此图稿</button></div>${adopting?promptEditor(a):''}<label>应用款色与位置</label><div class="applications">${a.applications.map(appRow).join('')}</div><button data-add-app style="margin-top:6px;font-size:12px">＋ 添加应用</button><label style="margin-top:12px">参与制作的参考图（与正文图号一致）</label><div class="refs">${editing.images.map(i=>`<label><input type="checkbox" data-ref="${esc(i.id)}" ${a.imageIds.includes(i.id)?'checked':''}><img src="/${esc(i.asset)}" alt="">${esc(i.label)}</label>`).join('')||'<span class="muted">暂无素材，可在原始资料列补充</span>'}</div></div>`}
function openEdit(c,draft=c.draft,analysisId=null){editing=structuredClone(c);adopting=analysisId;$('#edit-title').textContent=c.caseId+(analysisId?' · 核对新识别候选':' · 图稿设置');$('#edit-arts').innerHTML=draft.artworks.map(artEditor).join('');$('#edit-issues').innerHTML=draft.readingIssues.map(i=>`<div class="issue-edit"><strong>识别问题</strong><input aria-label="问题范围" data-scope value="${esc(i.scope)}"><textarea aria-label="问题说明" data-issue>${esc(i.issue)}</textarea><label><input type="checkbox" data-resolved> 我已处理此项，保存时移除提醒</label></div>`).join('');$('#edit-error').textContent='';$('#edit').showModal()}
function collectDraft(){return{artworks:[...$('#edit-arts').children].map(el=>({id:el.dataset.id,name:el.querySelector('[data-field="name"]').value,route:el.querySelector('[data-field="route"]').value,...(el.querySelector('[data-field="quality"]').checked?{quality:'high'}:{}),prompt:editedPrompt(el),applications:[...el.querySelectorAll('.app-row')].map(row=>({...Object.fromEntries(['style','color','position'].map(k=>[k,row.querySelector(`[data-field="${k}"]`).value])),...(row.dataset.sizeReference?{sizeReference:JSON.parse(row.dataset.sizeReference)}:{})})),imageIds:[...el.querySelectorAll('[data-ref]:checked')].map(x=>x.dataset.ref)})),readingIssues:[...document.querySelectorAll('.issue-edit')].filter(x=>!x.querySelector('[data-resolved]').checked).map(x=>({scope:x.querySelector('[data-scope]').value,issue:x.querySelector('[data-issue]').value}))}}
async function save(){if(editingBusy)return;editingBusy=true;$('#save').disabled=true;try{const body={caseId:editing.caseId,revision:editing.revision,supplementRevision:editing.supplement.revision,draft:collectDraft()};if(adopting)body.analysisId=adopting;const saved=await api('/api/requirements/save',body);editing.revision=saved.revision;autosaves.delete(editing.caseId);adopting=null;$('#edit').close();await refresh();toast('修改已保存')}catch(e){$('#edit-error').textContent=e.message}finally{editingBusy=false;$('#save').disabled=false}}
function showSupplements(){const c=find(uploadCase.caseId);uploadCase=structuredClone(c);$('#supplement-list').innerHTML=c.supplement.items.filter(x=>!x.removedAt).map(i=>`<p><span>${esc(i.name)} · ${esc(i.target)}</span><button class="remove" data-remove-supplement="${esc(i.id)}">移除补图</button></p>`).join('')}
document.addEventListener('click',async e=>{const close=e.target.closest('[data-close]');if(close){close.closest('dialog').close();return}const rmArt=e.target.closest('[data-remove-art]');if(rmArt){rmArt.closest('.edit-art').remove();return}const add=e.target.closest('[data-add-app]');if(add){add.previousElementSibling.insertAdjacentHTML('beforeend',appRow({style:'',color:'',position:''}));return}const rmApp=e.target.closest('[data-remove-app]');if(rmApp){rmApp.closest('.app-row').remove();return}const rmSup=e.target.closest('[data-remove-supplement]');if(rmSup){try{await api('/api/supplements',{caseId:uploadCase.caseId,revision:uploadCase.supplement.revision,action:'remove',id:rmSup.dataset.removeSupplement});await refresh();showSupplements();toast('补图已移除，历史文件保留')}catch(err){$('#upload-error').textContent=err.message}return}const b=e.target.closest('[data-action]');if(!b)return;let c=find(b.dataset.case);try{if(b.dataset.action==='retry-save'){await writer(c.caseId).retry();return}if(!await flushCase(c.caseId)&&b.dataset.action!=='edit'){toast('当前修改尚未保存，请先处理保存提示');return}c=current(find(c.caseId));switch(b.dataset.action){case'select-art':selectedArt.set(c.caseId,b.dataset.art);render();break;case'expand-row':expandedRows.has(c.caseId)?expandedRows.delete(c.caseId):expandedRows.add(c.caseId);render();break;case'field-drawer':case'source-drawer':openRequirementDrawer(c,b.dataset.section,b.dataset.action==='source-drawer');break;case'adopt-source':await api('/api/wps/adopt',{caseId:c.caseId,revision:c.revision});await refresh();toast('已载入新的原稿，旧修改已保留；请重新识别');break;case'artwork-edit':if(window.parent!==window){window.parent.postMessage({type:'batch-open-artwork',jobId:b.dataset.job},location.origin)}else{await repairEditor.open(b.dataset.job)}break;case'repair':await repairEditor.open(b.dataset.job);break;case'generate':await api('/api/production',{requests:[{caseId:c.caseId,revision:c.revision,supplementRevision:c.supplement.revision,artworkId:b.dataset.art}]});await refresh();toast('已提交当前要求；同一版本不会重复制作');break;case'generate-high':await api('/api/production',{requests:[{caseId:c.caseId,revision:c.revision,supplementRevision:c.supplement.revision,artworkId:b.dataset.art,quality:'high'}]});await refresh();toast('已提交高质量重做，每张约 ¥0.25');break;case'result-zoom':{const j=c.productions.find(j=>j.id===b.dataset.job),f=b.dataset.kind==='repair'?j.repair.file:j[b.dataset.kind];$('#zoom-title').textContent=c.caseId+' · '+j.name+(b.dataset.kind==='raw'?' · 抠图前原图':' · 制作结果');$('#zoom-image').src='/'+f.asset;$('#zoom-image').classList.remove('native');$('#zoom').showModal();break}case'zoom':{const i=c.images.find(i=>i.id===b.dataset.image);$('#zoom-title').textContent=c.caseId+' · '+i.label;$('#zoom-image').src='/'+i.asset;$('#zoom-image').classList.remove('native');$('#zoom').showModal();break}case'edit':openEdit(c);break;case'adopt':openEdit(c,c.analysis.proposedDraft,c.analysis.id);break;case'upload':uploadCase=c;$('#upload-file').value='';$('#upload-target').value='';$('#upload-error').textContent='';showSupplements();$('#upload').showModal();break;case'keep-color':{const keep=b.dataset.keep==='1';await api('/api/mockups/keep-color',{caseId:c.caseId,position:b.dataset.position,keep});toast(keep?b.dataset.position+'改用原图颜色，正在更新效果图':b.dataset.position+'恢复自动改色，正在更新效果图');await refresh();break}
case'analyze':if(c.draft&&!confirm('重新识别会再调用一次识别模型（约 ¥0.1），新结果会直接替换现在的需求理解。继续吗？'))break;busy.add(c.caseId);render();try{await api('/api/requirements/analyze',{caseId:c.caseId,revision:c.revision,supplementRevision:c.supplement.revision,requestId:crypto.randomUUID()});toast('已开始识别，完成后自动替换')}finally{busy.delete(c.caseId);await refresh();render()}break}}catch(err){toast(err.message)}});

$('#upload-save').onclick=async()=>{const button=$('#upload-save');button.disabled=true;try{const file=$('#upload-file').files[0];if(!file)throw Error('请选择图片');if(file.size>15*1024*1024)throw Error('单张图片不能超过15MB');const target=$('#upload-target').value;if(!target.trim())throw Error('请填写这张素材用于哪里');const base64=await new Promise((done,fail)=>{const reader=new FileReader();reader.onload=()=>done(String(reader.result).split(',')[1]);reader.onerror=()=>fail(Error('无法读取文件'));reader.readAsDataURL(file)});const id=crypto.randomUUID(),metadata={caseId:uploadCase.caseId,revision:uploadCase.supplement.revision,action:'upload',id,name:file.name,target};if(base64.length>3000000&&data.storage==='cloud'){const size=1400000,count=Math.ceil(base64.length/size);for(let n=0;n<count;n++)await api('/api/supplements/chunk',{id,index:n,base64:base64.slice(n*size,(n+1)*size)});await api('/api/supplements',{...metadata,uploadId:id,chunkCount:count});}else await api('/api/supplements',{...metadata,base64});await refresh();showSupplements();$('#upload-file').value='';toast('补图已保存，请重新识别本条并核对新结果')}catch(e){$('#upload-error').textContent=e.message}finally{button.disabled=false}};

function openRequirementDrawer(c,section,sourceOnly=false){const art=activeArtwork(c);drawerCase=c.caseId;$('#drawer-title').textContent=c.caseId+' · '+(sourceOnly?'原始需求':art?.name||'原始需求');$('#drawer-content').innerHTML=`<details class="drawer-source" ${sourceOnly?'open':''}><summary>对照客服原文与全部素材</summary><div class="drawer-original">${esc(c.sourceText)}</div><div class="assets">${imageButtons(c)}</div></details>${!sourceOnly&&art?inlinePrompt(c,art):''}`;$('#drawer-save').textContent='';$('#requirement-drawer').showModal();if(section)$('#drawer-content').querySelector(`[data-section="${section}"]`)?.focus();}
$('#requirement-drawer').addEventListener('close',()=>{const id=drawerCase;drawerCase=null;render();if(id)void flushCase(id)});
for(const b of document.querySelectorAll('[data-density]'))b.onclick=()=>{if(mockupEditor.isEditing()){toast('请先结束当前拖动或等待位置保存');return;}document.body.classList.toggle('comfortable',b.dataset.density==='comfortable');for(const x of document.querySelectorAll('[data-density]'))x.setAttribute('aria-pressed',String(x===b));expandedRows.clear();render()};


await refresh().catch(e=>{$('#rows').innerHTML='<tr><td colspan="4" class="empty">读取失败，请点击刷新。</td></tr>';toast(e.message)});
if(location.hash){document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView({block:'start'})}
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===window.parent&&e.data?.type==='batch-artwork-saved'){void refresh();toast('图稿已保存，正在更新关联效果图')}});
setInterval(()=>{if(refreshesInFlight||document.hidden||document.querySelector('dialog[open]')||inlineActive()||unsaved())return;refresh().catch(()=>{})},5000);
</script>
</html>
