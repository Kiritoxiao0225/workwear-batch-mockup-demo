<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>批量效果图 · ABCDE 工作台</title>
<style>
:root{color-scheme:light;--green:#17694c;--ink:#213c32;--line:#d6e2da;--muted:#718479;--surface:#f3f6f3}*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button,select{border:1px solid #bdcec3;border-radius:6px;background:white;color:var(--green);padding:7px 12px;cursor:pointer}button:hover{background:#edf4ef}button:disabled{opacity:.5;cursor:default}button.primary{background:var(--green);color:white;border-color:var(--green)}:focus-visible{outline:3px solid #79b39b;outline-offset:2px}header{padding:19px 28px;display:flex;align-items:center;justify-content:space-between;background:white;border-bottom:1px solid var(--line);gap:18px}.brand{display:flex;align-items:center;gap:12px}.mark{background:var(--green);color:white;border-radius:12px;width:45px;height:45px;display:grid;place-items:center;font-size:25px;font-weight:650}h1{font-size:19px;margin:0}p{margin:0}.muted{color:var(--muted);font-size:12px}nav{background:#edf3ee;padding:5px;border-radius:9px;display:flex;gap:8px}nav span{padding:7px 16px}nav .active{background:var(--green);color:white;border-radius:6px}.toolbar{padding:18px 28px 12px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tools input{width:265px;border:1px solid #bdcec3;border-radius:6px;padding:8px 12px;background:white}.summary{display:flex;gap:16px;color:#5c7164}.summary strong{color:var(--ink);font-size:18px}.scope{padding:0 28px 14px;color:#697d70;font-size:12px}.table-wrap{margin:0 24px 30px;border:1px solid #c7d8cc;background:white;overflow:auto;max-height:calc(100vh - 207px)}table{border-collapse:separate;border-spacing:0;width:100%;min-width:1220px;table-layout:fixed}th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:top;text-align:left}th:last-child,td:last-child{border-right:0}th{position:sticky;top:0;z-index:3;background:#f0f5f0;padding:15px 16px;font-size:16px;box-shadow:0 1px 0 #bbd0c1}th small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}th .letter{color:var(--green);margin-right:7px;font-size:20px}td{padding:19px 16px;background:white}.source{background:#f9fbf9}.row-id{font-weight:650;margin-right:9px;font-size:15px}.pill{display:inline-block;border-radius:4px;background:#edf4ef;color:#397056;font-size:11px;padding:2px 7px}.pill.warn{color:#986124;background:#fff4e7}.meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:11px}.copy{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8}.source .copy{max-height:310px;overflow:auto}.assets{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.asset{border:1px solid var(--line);padding:0;width:100px;overflow:hidden}.asset img{display:block;width:100%;height:85px;object-fit:contain;background:repeating-conic-gradient(#e4e9e4 0 25%,#f5f6f4 0 50%) 0/14px 14px}.asset span{display:block;font-size:11px;color:#597064;padding:2px 4px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.actions button{font-size:12px;padding:5px 9px}.issue{padding:9px 11px;background:#fff8ef;border-left:3px solid #d2a169;color:#795c36;font-size:12px;margin-top:13px;white-space:pre-wrap}.future{color:#adb8b0;background:#fcfdfb;text-align:center;padding-top:50px}.art{padding:0 0 16px;margin-bottom:16px;border-bottom:1px solid var(--line)}.art:last-child{border:0;margin:0;padding:0}.art strong{display:block;font-size:15px}.route{color:var(--green);font-size:12px;font-weight:650;margin:6px 0}.art p{font-size:13px}.binding{font-size:12px;color:#657d6d;margin-top:6px}.steps{margin:9px 0 0;padding-left:20px;font-size:12px}.await{background:#f1f5f0;padding:7px 9px;margin-top:8px;color:#59725f;font-size:12px}details{margin-top:8px;font-size:12px}summary{cursor:pointer;color:var(--green)}.empty{padding:60px;text-align:center;color:var(--muted)}dialog{border:1px solid #b9cfc0;border-radius:10px;max-width:calc(100vw - 32px);width:800px;padding:23px;color:var(--ink)}dialog::backdrop{background:#132b2380}dialog h2{margin:0;font-size:20px}.dialog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;gap:20px}dialog textarea{width:100%;height:380px;padding:12px;border:1px solid #bdcec3;border-radius:6px;resize:vertical;line-height:1.85;color:var(--ink)}dialog label{display:block;margin:10px 0}dialog input[type=text]{padding:8px;width:100%;border:1px solid #bdcec3;border-radius:5px}#zoom{width:min(1200px,96vw)}#zoom .image-wrap{overflow:auto;max-height:78vh;background:#e5ebe5;text-align:center}#zoom img{max-width:100%;max-height:73vh;object-fit:contain}#zoom img.native{max-width:none;max-height:none}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#244936;color:white;padding:10px 22px;border-radius:7px;z-index:20;display:none;max-width:80vw}.error{color:#a74634}footer{padding:0 28px 14px;font-size:11px;color:var(--muted)}@media(max-width:750px){header{padding:14px 16px}nav{display:none}.toolbar{padding:12px 16px}.scope{padding:0 16px 10px}.table-wrap{margin:0 12px 20px;max-height:calc(100vh - 242px)}.tools input{width:190px}.summary{font-size:12px;gap:9px}footer{padding:0 16px}}
</style>
<header><div class="brand"><div class="mark">衣</div><div><h1>工作服效果图</h1><p class="muted">ABCDE · 新版工作台</p></div></div><nav><span class="active">批量效果图</span><span>首次制作</span></nav></header>
<div class="toolbar"><div class="tools"><input id="search" aria-label="搜索需求" placeholder="搜索货号、原文、改写要求…"><select id="filter" aria-label="筛选进度"><option value="all">全部需求</option><option value="issues">有检查提醒</option><option value="pending">A 待人工确认</option><option value="b">B 已有计划</option></select><button id="refresh">刷新</button><button data-column="1">查看 A</button><button data-column="2">查看 B</button><button data-column="3">查看 C–E</button></div><div class="summary" id="counts">正在读取…</div></div>
<div class="scope" id="scope">正在读取本批 WPS 原文与素材。</div>
<div class="table-wrap"><table aria-label="ABCDE 批量效果图工作台"><colgroup><col style="width:230px"><col style="width:340px"><col style="width:340px"><col style="width:100px"><col style="width:110px"><col style="width:100px"></colgroup><thead><tr><th>原始需求<small>WPS 原文与全部素材</small></th><th><span class="letter">A</span>需求理解<small>核对并修改实际制作要求</small></th><th><span class="letter">B</span>制作规划<small>选择路线 · 明确执行步骤</small></th><th><span class="letter">C</span>图稿制作<small>本轮暂不执行</small></th><th><span class="letter">D</span>核对与交付<small>本轮暂不执行</small></th><th><span class="letter">E</span>任务管理<small>本轮暂不执行</small></th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">正在加载需求…</td></tr></tbody></table></div>
<footer id="foot">本机审阅；保存不回写 WPS。B 候选计划不代表图稿已经制作或验收。</footer>
<dialog id="edit"><div class="dialog-top"><h2 id="edit-title">修改制作要求</h2><button data-close>关闭</button></div><p class="muted">这里保存的完整正文将原样交给 B；没有另一份隐藏的精简提示词。</p><textarea id="edit-text" aria-label="完整制作要求"></textarea><label>本地核对人（确认时填写）<input type="text" id="reviewer" maxlength="80" autocomplete="off"></label><div class="actions"><button class="primary" id="save">保存草稿</button><button id="confirm">保存并确认要求</button></div><p id="edit-error" class="error" role="alert"></p></dialog>
<dialog id="upload"><div class="dialog-top"><h2>补充素材</h2><button data-close>关闭</button></div><label>图片文件<input id="upload-file" type="file" accept="image/png,image/jpeg,image/webp"></label><label>这张素材用于哪里<input id="upload-target" type="text" placeholder="例如：左胸缺失的 Logo"></label><button id="upload-save" class="primary">上传素材</button><p class="muted">补图后需重新识别、核对并采用新正文，再确认。</p></dialog>
<dialog id="zoom"><div class="dialog-top"><h2 id="zoom-title">原图</h2><div class="tools"><button id="native">切换原尺寸</button><button id="backdrop">切换深浅底</button><button data-close>关闭</button></div></div><div class="image-wrap"><img id="zoom-image" alt="完整原始素材"></div></dialog><div id="toast" role="status"></div>
<script type="module">
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data, editing, adopting=null, noticeTimer, lastSnapshot; const busy=new Set();
const arr=x=>Array.isArray(x)?x:[];
const routeNames={preserve_asset:'保留原图',local_render:'本地排字与组合',model_generate:'参考图生成／重建'};
const toolNames={'reuse':'直接复用','enhance-mediakit':'Media Kit 保真增强','generate-cliproxy':'参考图生成','render-text':'本地排字','compose':'图层组合','cutout-mediakit-product':'Media Kit · product','cutout-mediakit-general':'Media Kit · general','cutout-meitu':'美图 · 图形抠图'};
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('#toast').style.display='none',5000)}
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:undefined);const value=await r.json();if(!r.ok)throw Error(value.error||'请求失败');return value}
const get=id=>data.cases.find(c=>c.caseId===id);
const currentConfirmed=c=>c.state.confirmations.some(x=>x.text===c.text&&x.reviewRevision===(c.review?.revision||0)&&x.supplementRevision===c.supplement.revision);
function images(c){return [...c.images.map(i=>({asset:i.asset,label:`图${i.index}`,width:i.width,height:i.height})),...c.supplement.items.map((i,n)=>({...i,label:`图${c.images.length+n+1} · 补充`})).filter(i=>!i.removedAt)]}
function imageButtons(c){return images(c).map(i=>`<button class="asset" data-action="zoom" data-id="${esc(c.caseId)}" data-asset="${esc(i.asset)}"><img loading="lazy" src="/${esc(i.asset)}" alt="${esc(i.label)}"><span>${esc(i.label)} · ${i.width}×${i.height}</span></button>`).join('')}
function bCell(c){const b=c.b;if(!b)return `<p class="muted">等待制作规划</p><div class="actions"><button data-action="b" data-id="${esc(c.caseId)}" ${!data.planningReady||!c.text||busy.has(c.caseId)?'disabled':''}>${busy.has(c.caseId)?'正在规划…':'运行 B 候选规划'}</button></div>`;
 const plan=b.plan,warning=b.stale?'<div class="issue">A 正文或素材已变化。这是旧计划，需要重新规划。</div>':'';
 return `<div class="meta"><span class="pill ${b.status==='invalid_output'||b.status==='blocked'?'warn':''}">${({planned:'计划已返回',blocked:'有制作阻塞',invalid_output:'计划校验未通过',running:'正在规划',unknown:'结果未知'})[b.status]||esc(b.status)}</span><span class="muted">${b.durationMs?(b.durationMs/1000).toFixed(1)+' 秒':''} · ${b.inputAuthority==='designer_confirmed'?'基于确认稿':'基于 A 草稿，待核对'}</span></div>${warning}${arr(plan?.artworks).map(a=>`<div class="art"><strong>${esc(a.name||a.id)}</strong><div class="route">${esc(routeNames[a.route]||a.route)}</div><p>${esc(a.reason)}</p><div class="binding">应用：${esc(arr(a.applications).join('、'))}</div><ol class="steps">${arr(a.steps).map(s=>`<li>${esc(toolNames[s.capabilityId]||s.capabilityId)} · ${esc(s.reason)}</li>`).join('')}</ol>${a.background?.timing==='after_generation'?'<div class="await">生成后由 B 决定是否抠图及使用哪个模型。</div>':''}${a.blockedReason?`<div class="issue">${esc(a.blockedReason)}</div>`:''}<details><summary>素材绑定与判断依据</summary><p>${arr(a.references).map(r=>esc(r.imageId+' · '+r.role+' · '+r.usage)).join('<br>')}</p><p>把握：${esc(a.confidence)}；${esc(arr(a.uncertainties).join('；'))}</p></details></div>`).join('')}${b.error?`<div class="issue">${esc(b.error)}</div>`:''}${b.validation?.errors?.length?`<div class="issue">程序检查：${esc(b.validation.errors.join('；'))}</div>`:''}${plan?.reviewNotes?.length?`<details><summary>规划提醒 ${plan.reviewNotes.length} 项</summary><p>${esc(arr(plan.reviewNotes).join('；'))}</p></details>`:''}<div class="actions"><button data-action="${b.stale?'b':'bread'}" data-id="${esc(c.caseId)}" ${busy.has(c.caseId)?'disabled':''}>${busy.has(c.caseId)?'正在规划…':b.stale?'按当前 A 重新规划':'回读当前 B 计划'}</button></div>`}
function render(){const opened=new Set(Array.from(document.querySelectorAll('tbody tr')).flatMap(row=>Array.from(row.querySelectorAll('details')).flatMap((d,i)=>d.open?[row.id+':'+i]:[])));const q=$('#search').value.trim().toLowerCase(),f=$('#filter').value;const cases=data.cases.filter(c=>(!q||`${c.caseId} ${c.sourceText} ${c.text}`.toLowerCase().includes(q))&&(f!=='issues'||c.result.parsed?.readingIssues?.length||c.notes.length||c.b?.validation?.errors?.length)&&(f!=='pending'||!currentConfirmed(c))&&(f!=='b'||c.b));
 $('#counts').innerHTML=`<span>需求 <strong>${data.cases.length}</strong></span><span>A 已返回 <strong>${data.cases.filter(c=>c.result.status==='returned').length}</strong></span><span>B 已返回 <strong>${data.cases.filter(c=>c.b?.plan).length}</strong></span>`;
 $('#scope').textContent=`${data.run.selection||'WPS 真实需求'} · ${data.run.imageCount} 张原始素材 · 读取时间 ${new Date(data.run.sourceReadAt).toLocaleString('zh-CN')} · 当前显示 ${cases.length} 条`;
 $('#foot').textContent=`A、B：CLIProxy / gpt-5.6-sol / low。C、D、E 尚未执行。本机审阅，保存不回写 WPS；B 草稿规划不是人工确认或图稿验收。`;
 $('#rows').innerHTML=cases.map(c=>{const last=c.state.analyses.at(-1);return `<tr id="${esc(c.caseId)}"><td class="source"><div class="meta"><span class="row-id">${esc(c.caseId)}</span><span class="pill">${esc(c.wpsStatus)}</span></div><div class="copy">${esc(c.sourceText)}</div><div class="assets">${imageButtons(c)}</div>${!images(c).length?'<p class="muted">没有附带图片</p>':''}<div class="actions"><button data-action="upload" data-id="${esc(c.caseId)}">补充素材</button></div><details><summary>来源记录</summary>${esc(c.sourceRecordId)}</details></td><td><div class="meta"><span class="pill ${currentConfirmed(c)?'':'warn'}">${currentConfirmed(c)?'人工已确认':c.text?'待人工核对':'等待 A 返回'}</span><span class="muted">${c.result.elapsedMs?(c.result.elapsedMs/1000).toFixed(1)+' 秒':''}${c.review?' · 已保存修改':''}</span></div><div class="copy">${esc(c.text||c.result.error||'尚未运行')}</div>${(c.result.parsed?.readingIssues||[]).map(i=>`<div class="issue">${esc(i.scope)}：${esc(i.issue)}</div>`).join('')}${c.notes.map(n=>`<div class="issue">初审提醒：${esc(typeof n==='string'?n:n.message||n.issue)}</div>`).join('')}<div class="actions"><button data-action="edit" data-id="${esc(c.caseId)}" ${!c.text?'disabled':''}>修改／确认要求</button><button data-action="reanalyze" data-id="${esc(c.caseId)}" ${last?.status==='running'||c.result.status!=='returned'?'disabled':''}>${last?.status==='running'?'重新识别中…':'重新识别 A'}</button></div>${last?.status==='returned'&&last.id!==c.review?.analysisId?`<div class="actions"><button data-action="adopt" data-id="${esc(c.caseId)}">查看并采用新识别结果</button></div>`:''}${last?.error?`<div class="issue">${esc(last.error)}</div>`:''}</td><td>${bCell(c)}</td><td class="future">—</td><td class="future">—</td><td class="future">—</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">没有匹配的需求</td></tr>';restoreDetails(opened);
}
function restoreDetails(opened){for(const row of document.querySelectorAll('tbody tr'))Array.from(row.querySelectorAll('details')).forEach((d,i)=>{d.open=opened.has(row.id+':'+i)})}
async function refresh(){const next=await api('/api/workbench'), snapshot=JSON.stringify(next);data=next;if(snapshot!==lastSnapshot){lastSnapshot=snapshot;render()}}
async function digest(text){return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text)))).map(x=>x.toString(16).padStart(2,'0')).join('')}
function openEdit(c,text=c.text){editing=c;$('#edit-title').textContent=c.caseId+' · 修改制作要求';$('#edit-text').value=text;$('#edit-error').textContent='';$('#edit').showModal()}
document.addEventListener('click',async e=>{const jump=e.target.closest('[data-column]');if(jump){const th=document.querySelectorAll('thead th')[Number(jump.dataset.column)];$('.table-wrap').scrollTo({left:th.offsetLeft-document.querySelector('table').offsetLeft,behavior:'smooth'});return}const close=e.target.closest('[data-close]');if(close){close.closest('dialog').close();return}const btn=e.target.closest('[data-action]');if(!btn)return;const c=get(btn.dataset.id);try{switch(btn.dataset.action){case'zoom':{const i=images(c).find(i=>i.asset===btn.dataset.asset);$('#zoom-title').textContent=c.caseId+' · '+i.label;$('#zoom-image').src='/'+i.asset;$('#zoom-image').classList.remove('native');$('#zoom').showModal();break}case'edit':adopting=null;openEdit(c);break;case'upload':editing=c;$('#upload-file').value='';$('#upload-target').value='';$('#upload').showModal();break;case'reanalyze':await api('/api/reanalyze',{caseId:c.caseId,requestId:crypto.randomUUID(),reviewRevision:c.review?.revision||0,supplementRevision:c.supplement.revision});toast('已提交重新识别，请等待结果；当前正文保留');await refresh();break;case'adopt':{const a=await api('/api/adopt-analysis',{caseId:c.caseId,analysisId:c.state.analyses.at(-1).id,reviewRevision:c.review?.revision||0,supplementRevision:c.supplement.revision});adopting=a.analysisId;openEdit(c,a.text);break}case'bread':await refresh();toast('已回读保存的 B 结果，没有调用模型');break;case'b':busy.add(c.caseId);render();try{await api('/api/b-plan',{caseId:c.caseId,reviewRevision:c.review?.revision||0,supplementRevision:c.supplement.revision,textSHA256:await digest(c.text)});toast('B 结果已保存，请核对计划')}finally{busy.delete(c.caseId);await refresh();render()}break}}catch(error){toast(error.message)}});
async function save(confirm){const c=editing;try{if(confirm&&!$('#reviewer').value.trim())throw Error('请填写本地核对人名称');const body={caseId:c.caseId,text:$('#edit-text').value,note:c.review?.note||'',state:'pending',revision:c.review?.revision||0,supplementRevision:c.supplement.revision};if(adopting||c.review?.analysisId)body.analysisId=adopting||c.review.analysisId;const r=await api('/api/reviews',body);editing={...c,review:r};if(confirm)await api('/api/confirm',{caseId:c.caseId,requestId:crypto.randomUUID(),text:r.text,reviewRevision:r.revision,supplementRevision:c.supplement.revision,confirmedBy:$('#reviewer').value.trim()});$('#edit').close();await refresh();toast(confirm?'要求及确认记录已保存':'草稿已保存；如有旧 B 计划，会标记为待更新')}catch(e){$('#edit-error').textContent=e.message;await refresh()}}
$('#save').onclick=()=>save(false);$('#confirm').onclick=()=>save(true);$('#upload-save').onclick=async()=>{const file=$('#upload-file').files[0],target=$('#upload-target').value.trim();if(!file||!target)return toast('请选择图片并填写用途');try{if(file.size>15*1024*1024)throw Error('单张图片不能超过 15MB');const base64=await new Promise((done,fail)=>{const r=new FileReader();r.onload=()=>done(r.result.split(',')[1]);r.onerror=fail;r.readAsDataURL(file)});await api('/api/supplements',{caseId:editing.caseId,action:'upload',revision:editing.supplement.revision,id:crypto.randomUUID(),name:file.name,target,base64});$('#upload').close();await refresh();toast('素材已保存，请点击重新识别 A')}catch(e){toast(e.message)}};
$('#native').onclick=()=>$('#zoom-image').classList.toggle('native');$('#backdrop').onclick=()=>{const w=$('#zoom .image-wrap');w.style.background=w.style.background==='rgb(44, 57, 51)'?'#e5ebe5':'#2c3933'};$('#refresh').onclick=()=>refresh().catch(e=>toast(e.message));$('#search').oninput=render;$('#filter').onchange=render;await refresh().catch(e=>toast(e.message));setInterval(()=>{if(!document.querySelector('dialog[open]')&&!document.hidden)refresh().catch(()=>{})},6000);
</script></html>
