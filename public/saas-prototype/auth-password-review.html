<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号登录 · 工作服效果图 · 交互预览</title>
<style>
:root{color-scheme:light;--page:#f3f6f4;--ink:#17211c;--muted:#65726b;--line:#d9e2dc;--brand:#176b46;--soft:#e6f4ec}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button,a,input{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}a,.text-btn{color:var(--brand);text-decoration:none}.text-btn{border:0;background:none;padding:0;font-size:13px}a:hover,.text-btn:hover{text-decoration:underline}:focus-visible{outline:3px solid #a0cfb3;outline-offset:3px}[hidden]{display:none!important}.review{max-width:1040px;margin:24px auto 0;padding:0 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:12px}.review-label{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.tag{border:1px solid #c9d8ce;border-radius:5px;padding:2px 7px;color:var(--brand)}.review nav{display:flex;gap:5px;flex-wrap:wrap}.review nav a{padding:5px 11px;color:var(--muted);border-radius:6px}.review nav a[aria-current=page]{background:#e3ece6;color:var(--brand);font-weight:600}.shell{display:grid;grid-template-columns:minmax(0,1fr) 420px;width:min(920px,calc(100% - 48px));min-height:564px;margin:38px auto 0;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 16px 38px #17211c12}.aside{display:flex;flex-direction:column;gap:30px;padding:40px;background:linear-gradient(160deg,#176b46,#0f5637);color:#fff}.brand{display:flex;align-items:center;gap:11px}.mark{display:grid;place-items:center;width:40px;height:40px;background:#ffffff22;border-radius:9px;font-size:22px;font-weight:700}.brand strong{font-size:15px}.brand small{display:block;color:#ffffffaa;font-size:11px}.aside h2{font-size:22px;font-weight:650;line-height:1.65;margin:1px 0 0}.aside ul{padding-left:18px;margin:0;color:#ffffffd9;font-size:13px;line-height:2.2}.aside .foot{margin:auto 0 0;padding-top:42px;color:#ffffff88;font-size:11px}.main{padding:40px 36px;min-width:0;display:flex;flex-direction:column}.content{flex:1}.main h1{margin:0 0 7px;font-size:22px;font-weight:650;letter-spacing:-.3px}.sub{margin:0 0 28px;color:var(--muted);font-size:13px}.field{margin-bottom:19px}.field label,.label-row{display:block;font-size:12px;font-weight:600;margin-bottom:7px}.label-row{display:flex;justify-content:space-between;align-items:center}.label-row label{margin:0}.label-row a{font-weight:400;font-size:12px}input:not([type=checkbox]){width:100%;height:44px;border:1px solid #ccd9d1;border-radius:8px;padding:0 12px;background:#fff;color:var(--ink);font-size:13px;transition:border-color .15s}input::placeholder{color:#97a19b}input:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px #176b4610}input[aria-invalid=true]{border-color:#b43c35}.password{position:relative}.password input{padding-right:48px}.eye{position:absolute;right:5px;top:5px;display:grid;place-items:center;width:34px;height:34px;border:0;background:transparent;color:#77847c;border-radius:5px}.eye:hover{background:#f0f5f1}.eye svg{width:18px;height:18px}.hint{font-size:11px;color:var(--muted);margin:7px 0 0;line-height:1.7}.primary,.secondary{height:45px;border-radius:8px;width:100%;font-size:14px;font-weight:600}.primary{background:var(--brand);color:#fff;border:1px solid var(--brand)}.primary:hover{background:#105a39}.secondary{background:#fff;border:1px solid var(--line);color:var(--brand);margin-top:10px}.divider{display:flex;align-items:center;gap:12px;color:#8d9791;font-size:12px;margin:24px 0 16px}.divider:before,.divider:after{content:"";height:1px;background:#e4ebe6;flex:1}.register-link{text-align:center;color:var(--muted);font-size:13px;margin:18px 0 0}.register-link a{font-weight:600;margin-left:5px}.legacy{margin-top:24px;padding-top:16px;border-top:1px solid #edf1ee;color:var(--muted);font-size:11px}.legacy a{margin-left:4px}.terms{margin:28px 0 0;color:#89938d;font-size:11px;line-height:1.9}.terms span{color:#65726b}.code-line{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:8px}.code-line button{border:1px solid #ccd9d1;border-radius:8px;background:#fff;color:var(--brand);font-size:12px}.code-line button:hover{background:#f3f7f4}.steps{display:flex;gap:14px;align-items:center;font-size:12px;color:#919b95;margin:-6px 0 24px}.steps .active{color:var(--brand);font-weight:600}.step-dot{display:inline-grid;place-items:center;background:#edf2ef;border-radius:50%;width:21px;height:21px;margin-right:5px;font-size:11px}.active .step-dot{background:var(--soft);color:var(--brand)}.steps .line{flex:1;height:1px;background:#e0e8e2}.back{display:inline-flex;gap:5px;align-items:center;color:var(--muted);font-size:12px;margin:0 0 23px}.info{padding:10px 12px;border:1px solid #dbe9df;background:#f4f9f6;color:#3e6650;border-radius:8px;font-size:12px;margin-bottom:20px;overflow-wrap:anywhere}.error{border:1px solid #edcfca;background:#fff5f2;border-radius:7px;padding:9px 11px;font-size:12px;color:#a1382d;margin:0 0 16px}.success{display:flex;flex-direction:column;justify-content:center;min-height:394px}.check{display:grid;place-items:center;width:50px;height:50px;background:var(--soft);color:var(--brand);border-radius:50%;font-size:24px;margin-bottom:22px}.success p{font-size:13px;color:var(--muted);line-height:1.9;margin:0 0 24px}.success h1{margin-bottom:10px}.demo{max-width:920px;margin:20px auto 30px;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;padding:0 3px;font-size:12px;color:#7a887f}.demo strong{font-weight:500;color:#4e6256}.demo button{font-size:12px;white-space:nowrap}.toast{max-width:920px;margin:12px auto 0;text-align:right;color:var(--brand);font-size:12px}.mobile-brand{display:none}
@media(max-width:760px){.review{margin-top:16px;flex-direction:column;align-items:flex-start;gap:12px;padding:0 20px}.review nav a{padding:5px 8px}.shell{grid-template-columns:1fr;width:calc(100% - 32px);margin-top:22px;min-height:550px}.aside{display:none}.main{padding:28px 25px}.mobile-brand{display:flex;margin-bottom:28px;color:var(--brand);font-weight:650;gap:8px;align-items:center}.mobile-brand b{background:var(--brand);color:#fff;border-radius:6px;width:28px;height:28px;display:grid;place-items:center}.demo{margin:18px 22px 28px;font-size:11px;display:block}.demo button{margin-top:10px}.toast{margin:10px 22px;text-align:left}.main h1{font-size:21px}.terms{margin-top:25px}.legacy{font-size:11px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<header class="review"><div class="review-label"><span class="tag">交互预览</span><span>仅演示流程 · 不发送邮件，不创建真实账号</span></div><nav aria-label="预览页面"><a href="#login" data-route="login">登录</a><a href="#register" data-route="register">邮箱注册</a><a href="#reset" data-route="reset">找回密码</a><a href="#setup" data-route="setup">老用户设置密码</a></nav></header>
<div class="shell"><aside class="aside"><div class="brand"><span class="mark">衣</span><div><strong>工作服效果图</strong><small>批量图稿与效果图制作台</small></div></div><h2>上传衣服和需求<br>批量拿到可交付的效果图</h2><ul><li>自己的商品素材库，标一次印花位置反复用</li><li>需求理解 → 图稿制作 → 上衣效果图，一条链路跑完</li><li>生图、无损放大、抠图都在后台队列，关页面继续跑</li><li>按实际发生的动作计费，失败不扣</li></ul><p class="foot">内测期间需管理员开通额度后才能发起制作</p></aside><main class="main"><div class="mobile-brand"><b>衣</b>工作服效果图</div><div id="content" class="content"></div></main></div>
<div class="demo"><span id="demo-note">演示账号：demo@mockfits.com　密码：Mockfits2026</span><button class="text-btn" id="fill-demo">填入演示内容 ↗</button></div><div id="toast" class="toast" aria-live="polite"></div>
<script>
const content=document.querySelector('#content');let mode='login',step=1,email='',sentEmail='',timer=null,seconds=0,notice='';const demoAccounts=new Map([['demo@mockfits.com','Mockfits2026']]);
const eye='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
const passwordField=(id,label,autocomplete='new-password')=>`<div class="field"><label for="${id}">${label}</label><div class="password"><input id="${id}" name="${id}" type="password" autocomplete="new-password" placeholder="${autocomplete==='current-password'?'请输入密码':'至少 8 位，建议使用字母、数字或符号'}" required minlength="${autocomplete==='current-password'?1:8}" maxlength="128"><button class="eye" type="button" aria-label="显示${label}" aria-pressed="false" data-toggle="${id}">${eye}</button></div></div>`;
const terms='<p class="terms">继续即表示同意<span>《服务条款》</span>与<span>《隐私政策》</span>。<br>你的素材、图稿和效果图仅在自己的工作区内可见。</p>';
const steps=()=>`<div class="steps"><span class="${step===1?'active':''}"><b class="step-dot">${step===2?'✓':'1'}</b>验证邮箱</span><span class="line"></span><span class="${step===2?'active':''}"><b class="step-dot">2</b>${mode==='reset'?'重置密码':'设置密码'}</span></div>`;
function error(message){const el=document.querySelector('#error');el.textContent=message;el.hidden=false;el.setAttribute('tabindex','-1');el.focus()}
function render(){document.querySelectorAll('[data-route]').forEach(a=>a.setAttribute('aria-current',a.dataset.route===mode?'page':'false'));document.querySelector('#toast').textContent='';document.querySelector('#fill-demo').hidden=false;document.querySelector('#demo-note').textContent=mode==='login'?'演示账号：demo@mockfits.com　密码：Mockfits2026':step===1?'演示验证码：123456 · 点击“获取验证码”后验证邮箱':'这是交互演示，请勿填写你正在使用的真实密码。';
if(mode==='login'){content.innerHTML=`<h1>账号登录</h1><p class="sub">登录后，继续制作你的图稿和效果图。</p>${notice?'<div class="info" id="notice"></div>':''}<form id="auth-form"><div class="field"><label for="email">账号</label><input type="email" id="email" name="email" autocomplete="off" placeholder="请输入注册邮箱" required maxlength="254"></div><div class="label-row"><label for="password">密码</label><a href="#reset">忘记密码？</a></div>${passwordField('password','密码','current-password').replace('<label for="password">密码</label>','')}<div id="error" class="error" role="alert" hidden></div><button class="primary" type="submit">登录</button></form><div class="divider">还没有账号？</div><a class="secondary" href="#register" style="display:grid;place-items:center;margin:0">用邮箱注册</a><p class="legacy">之前用邮箱验证码登录？<a href="#setup">首次设置密码</a></p>${terms}`;if(notice)document.querySelector('#notice').textContent=notice;document.querySelector('#email').value=email;
}else{const title=mode==='register'?'邮箱注册':mode==='reset'?'找回密码':'首次设置密码';const subtitle=mode==='register'?'验证邮箱并设置密码，即可创建账号。':mode==='reset'?'通过注册邮箱验证身份，找回你的账号。':'为已通过验证码注册的账号补充登录密码。';content.innerHTML=`<a class="back" href="#login">← 返回登录</a><h1>${title}</h1><p class="sub">${subtitle}</p>${steps()}<form id="auth-form">${step===1?`<div class="field"><label for="email">${mode==='register'?'邮箱':'注册邮箱'}</label><input id="email" name="email" type="email" autocomplete="off" placeholder="name@example.com" required maxlength="254"><p class="hint">${mode==='register'?'此邮箱将作为你的登录账号。':'请输入原账号使用的邮箱，原有资料保持不变。'}</p></div><div class="field"><label for="code">邮箱验证码</label><div class="code-line"><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位数字" pattern="[0-9]{6}" maxlength="6" required><button id="send-code" type="button">获取验证码</button></div><p class="hint" id="send-hint">请查收邮箱中的 6 位验证码，5 分钟内有效。</p></div>`:`<div class="info">邮箱已验证：<strong id="verified-email"></strong></div>${passwordField('password',mode==='reset'?'新密码':'登录密码')}${passwordField('confirm','确认密码')}`}<div id="error" class="error" role="alert" hidden></div><button class="primary" type="submit">${step===1?'验证邮箱，下一步':mode==='register'?'注册并进入工作台':mode==='reset'?'重置密码':'保存密码'}</button></form>${mode==='register'?'<p class="register-link">已有账号？<a href="#login">直接登录</a></p>':'<p class="hint" style="margin-top:16px">'+(mode==='reset'?'重置后需使用新密码重新登录。':'设置密码不会新建账号，也不会改变原有素材和积分。')+'</p>'}${mode==='register'?terms:''}`;if(step===1)document.querySelector('#email').value=email;else document.querySelector('#verified-email').textContent=email;}
bind();}
function bind(){document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const input=document.getElementById(b.dataset.toggle);const show=input.type==='password';input.type=show?'text':'password';b.setAttribute('aria-pressed',String(show));b.setAttribute('aria-label',(show?'隐藏':'显示')+(b.dataset.toggle==='confirm'?'确认密码':mode==='reset'?'新密码':'密码'))});const send=document.querySelector('#send-code');if(send)send.onclick=()=>{const input=document.querySelector('#email');if(!input.reportValidity())return;email=input.value.trim().toLowerCase();sentEmail=email;seconds=60;send.disabled=true;send.textContent='60 秒后重发';document.querySelector('#send-hint').textContent='演示验证码为 123456，此预览不会发送真实邮件。';clearInterval(timer);timer=setInterval(()=>{seconds--;if(document.contains(send))send.textContent=seconds>0?seconds+' 秒后重发':'重新获取';if(seconds<=0){clearInterval(timer);send.disabled=false}},1000)};document.querySelector('#auth-form').onsubmit=e=>{e.preventDefault();document.querySelector('#error').hidden=true;if(mode==='login'){email=document.querySelector('#email').value.trim().toLowerCase();if(demoAccounts.get(email)!==document.querySelector('#password').value)return error('账号或密码不正确，请重试，或通过邮箱找回密码。');success('登录成功','现在将进入你的工作台，继续使用原有素材和图稿。','返回登录预览');return}if(step===1){email=document.querySelector('#email').value.trim().toLowerCase();if(sentEmail!==email)return error('请先为当前邮箱获取验证码。');if(document.querySelector('#code').value!=='123456')return error('验证码不正确，请重新输入。演示验证码为 123456。');if(mode==='register'&&demoAccounts.has(email))return error('邮箱验证通过，此邮箱已有账号。请返回登录，或通过“忘记密码”重置密码。');clearInterval(timer);step=2;render();document.querySelector('#password').focus();return}const pass=document.querySelector('#password').value;if(pass!==document.querySelector('#confirm').value)return error('两次输入的密码不一致，请重新确认。');demoAccounts.set(email,pass);if(mode==='register')success('注册成功','邮箱已验证，密码已设置。账号已准备好，可以进入工作台开始制作。','返回登录预览');else{notice=mode==='reset'?'密码已重置，请使用新密码登录。':'密码设置成功，请使用邮箱和密码登录。';location.hash='login';}};}
function success(title,message,button){content.innerHTML=`<section class="success"><div class="check">✓</div><h1>${title}</h1><p>${message}</p><div class="info">交互预览已完成，未创建或修改真实账号。</div><button class="primary" id="return">${button}</button></section>`;document.querySelector('#fill-demo').hidden=true;document.querySelector('#demo-note').textContent='正式版本会进入工作台；此处仅预览登录与注册流程。';document.querySelector('#return').onclick=()=>{mode='login';step=1;notice='';if(location.hash==='#login')render();else location.hash='login';};}
function route(){const value=location.hash.slice(1);mode=['login','register','reset','setup'].includes(value)?value:'login';step=1;sentEmail='';clearInterval(timer);render();}window.addEventListener('hashchange',route);document.querySelector('#fill-demo').onclick=()=>{const input=document.querySelector('#email');if(input)input.value=mode==='register'?'newuser@example.com':'demo@mockfits.com';const p=document.querySelector('#password');if(p)p.value='Mockfits2026';const c=document.querySelector('#confirm');if(c)c.value='Mockfits2026';const code=document.querySelector('#code');if(code){document.querySelector('#send-code').click();code.value='123456';}document.querySelector('#toast').textContent='已填入演示内容，可以继续点击主按钮。';};route();
</script></body></html>
