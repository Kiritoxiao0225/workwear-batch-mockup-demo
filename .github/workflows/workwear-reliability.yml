name: Workwear reliability verification
on:
  push:
    branches: [fix/wps-production-reliability-20260911]
    paths-ignore: ['.github/repair/**', '.github/workflows/apply-workwear-repair.yml']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: workwear-reliability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without production credentials
        id: install
        run: |
          mkdir -p verification output
          npm ci 2>&1 | tee verification/install.log
          git rev-parse HEAD > verification/commit.txt
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint 2>&1 | tee verification/lint.log
      - name: Full TypeScript check
        id: types
        continue-on-error: true
        run: npm run typecheck 2>&1 | tee verification/typecheck.log
      - name: Complete repository test suite
        id: tests
        continue-on-error: true
        run: npm test -- --reporter=default --reporter=json --outputFile=verification/vitest.json 2>&1 | tee verification/tests.log
      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build 2>&1 | tee verification/build.log
      - name: Isolated production storage integration
        id: storage
        continue-on-error: true
        run: npm run test:production-storage 2>&1 | tee verification/storage.log
      - name: Isolated durable job integration
        id: jobs
        continue-on-error: true
        run: npm run test:artwork-jobs 2>&1 | tee verification/jobs.log
      - name: Isolated shared artwork integration
        id: shared
        continue-on-error: true
        run: npm run test:shared-artwork 2>&1 | tee verification/shared.log
      - name: Isolated reliability integration
        id: reliability
        continue-on-error: true
        run: npm run test:reliability 2>&1 | tee verification/reliability.log
      - name: HTTP page smoke check
        id: smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          npm start -- --hostname 127.0.0.1 --port 3210 > verification/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3210/wps-production/overview > verification/overview.html; then break; fi
            sleep 1
          done
          grep -q '精简总览' verification/overview.html
          curl --fail --silent http://127.0.0.1:3210/wps-production > verification/editor.html
          echo 'Overview and original editor return HTTP 200; no production services invoked.' | tee verification/smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workwear-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: verification
          retention-days: 14
      - name: Require all checks to pass
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPES: ${{ steps.types.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
          STORAGE: ${{ steps.storage.outcome }}
          JOBS: ${{ steps.jobs.outcome }}
          SHARED: ${{ steps.shared.outcome }}
          RELIABILITY: ${{ steps.reliability.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          for name in INSTALL LINT TYPES TESTS BUILD STORAGE JOBS SHARED RELIABILITY SMOKE; do
            printf '%s=%s\n' "$name" "${!name}" | tee -a "$GITHUB_STEP_SUMMARY"
            test "${!name}" = success || exit 1
          done
